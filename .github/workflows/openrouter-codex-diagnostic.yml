name: OpenRouter Codex Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
      - name: Install the pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0
      - name: Exercise OpenRouter command auth and tool use
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY"
          probe_home="$RUNNER_TEMP/openrouter-codex-probe"
          mkdir -p "$probe_home"
          chmod 700 "$probe_home"
          printf '%s\n' \
            'model_provider = "openrouter"' \
            '' \
            '[model_providers.openrouter]' \
            'name = "OpenRouter"' \
            'base_url = "https://openrouter.ai/api/v1"' \
            'wire_api = "responses"' \
            '' \
            '[model_providers.openrouter.auth]' \
            'command = "node"' \
            'args = ["-e", "process.stdout.write(process.env[process.argv[1]] ?? '\''\'')", "OPENROUTER_API_KEY"]' \
            > "$probe_home/config.toml"
          chmod 600 "$probe_home/config.toml"
          CODEX_HOME="$probe_home" timeout --signal=TERM --kill-after=30s 10m \
            codex exec --json --skip-git-repo-check --sandbox read-only \
            --model openai/gpt-5.6-luna \
            --config model_reasoning_effort='"xhigh"' \
            "Use the shell tool to run 'printf ready'. Then report only the exact command output."

name: Target Repository E2E

on:
  pull_request:
    paths-ignore:
      - benchmarks/history.json
      - docs/assets/eval-history/**
  push:
    branches:
      - main
    paths-ignore:
      - benchmarks/history.json
      - docs/assets/eval-history/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-matrix:
    name: Load immutable target matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate target matrix cardinality
        run: |
          jq -e '
            .schema_version == "1.0" and
            (.targets | type == "array" and length == 3) and
            (([.targets[].id] | sort) == [
              "stableswap-ng-vyper",
              "venus-isolated-pools-hardhat",
              "very-liquid-vaults-foundry"
            ])
          ' scripts/ci/target-e2e-manifest.json >/dev/null

      - name: Read target manifest
        id: matrix
        run: echo "targets=$(jq -c '.targets' scripts/ci/target-e2e-manifest.json)" >> "$GITHUB_OUTPUT"

  ultrafuzz-target:
    name: Ultrafuzz target (${{ matrix.target.name }})
    needs: target-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.target-matrix.outputs.targets) }}
    steps:
      - name: Check out Ultrafuzz
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ultrafuzz
        run: pnpm -w build

      - name: Validate target manifest
        run: bun scripts/ci/target-e2e-ci.ts validate-manifest scripts/ci/target-e2e-manifest.json

      - name: Prepare Ultrafuzz CLI
        run: |
          mkdir -p .ci-bin
          cat > .ci-bin/ultrafuzz <<'SH'
          #!/usr/bin/env bash
          exec node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" "$@"
          SH
          chmod +x .ci-bin/ultrafuzz
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"
          .ci-bin/ultrafuzz --help

      - name: Check out immutable target
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ matrix.target.repository_slug }}
          ref: ${{ matrix.target.revision }}
          path: .target-source
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable target revision
        run: test "$(git -C .target-source rev-parse HEAD)" = "${{ matrix.target.revision }}"

      - name: Initialize target evidence
        run: |
          evidence="$GITHUB_WORKSPACE/.codex-runs/e2e-targets/${{ matrix.target.id }}/evidence"
          mkdir -p "$evidence"
          bun scripts/ci/target-e2e-ci.ts write-target-metadata \
            scripts/ci/target-e2e-manifest.json \
            "${{ matrix.target.id }}" \
            "$evidence/target.json" \
            "$(git -C .target-source rev-parse HEAD)"

      - name: Install Foundry
        if: matrix.target.framework == 'foundry'
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0

      - name: Build Foundry target
        if: matrix.target.framework == 'foundry'
        working-directory: .target-source
        run: |
          log="$GITHUB_WORKSPACE/.codex-runs/e2e-targets/${{ matrix.target.id }}/evidence/target-build.log"
          set +e
          forge build >"$log" 2>&1
          status=$?
          set -e
          bun "$GITHUB_WORKSPACE/scripts/ci/target-e2e-ci.ts" redact "$log"
          cat "$log"
          exit "$status"

      - name: Set up compatible Hardhat runtime
        if: matrix.target.framework == 'hardhat'
        id: hardhat-runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 16

      - name: Record compatible Hardhat runtime
        if: matrix.target.framework == 'hardhat'
        id: hardhat-runtime-path
        run: echo "bin=$(dirname "$(command -v node)")" >> "$GITHUB_OUTPUT"

      - name: Install and compile Hardhat target
        if: matrix.target.framework == 'hardhat'
        working-directory: .target-source
        run: |
          log="$GITHUB_WORKSPACE/.codex-runs/e2e-targets/${{ matrix.target.id }}/evidence/target-build.log"
          set +e
          node .yarn/releases/yarn-1.22.1.cjs install --frozen-lockfile >"$log" 2>&1 && \
            env -u FORK_MAINNET node .yarn/releases/yarn-1.22.1.cjs hardhat:compile >>"$log" 2>&1
          status=$?
          set -e
          bun "$GITHUB_WORKSPACE/scripts/ci/target-e2e-ci.ts" redact "$log"
          cat "$log"
          exit "$status"

      - name: Set up compatible Vyper runtime
        if: matrix.target.framework == 'vyper'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .target-source/poetry.lock

      - name: Install and compile Vyper target
        if: matrix.target.framework == 'vyper'
        working-directory: .target-source
        run: |
          log="$GITHUB_WORKSPACE/.codex-runs/e2e-targets/${{ matrix.target.id }}/evidence/target-build.log"
          set +e
          python -m pip install poetry==1.5.1 >"$log" 2>&1 && \
            poetry install --no-interaction --no-root >>"$log" 2>&1 && \
            poetry run vyper contracts/main/CurveStableSwapNG.vy >/dev/null 2>>"$log"
          status=$?
          set -e
          bun "$GITHUB_WORKSPACE/scripts/ci/target-e2e-ci.ts" redact "$log"
          cat "$log"
          exit "$status"

      - name: Restore Ultrafuzz Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Preserve compatible Yarn runtime for agents
        if: matrix.target.framework == 'hardhat'
        env:
          NODE16_BIN: ${{ steps.hardhat-runtime-path.outputs.bin }}
        run: |
          target_yarn_cli="$GITHUB_WORKSPACE/.target-source/.yarn/releases/yarn-1.22.1.cjs"
          cat > .ci-bin/yarn <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          yarn_cli="$PWD/.yarn/releases/yarn-1.22.1.cjs"
          if [ ! -f "$yarn_cli" ]; then
            yarn_cli="__TARGET_YARN_CLI__"
          fi
          if [ ! -f "$yarn_cli" ]; then
            echo "Pinned target Yarn CLI was not found." >&2
            exit 1
          fi
          exec env PATH="__NODE16_BIN__:$PATH" "__NODE16_BIN__/node" "$yarn_cli" "$@"
          SH
          sed -i \
            -e "s|__NODE16_BIN__|$NODE16_BIN|g" \
            -e "s|__TARGET_YARN_CLI__|$target_yarn_cli|g" \
            .ci-bin/yarn
          chmod +x .ci-bin/yarn

      - name: Run bounded target submission smoke
        id: bounded-submission
        env:
          ULTRAFUZZ_BIN: ${{ github.workspace }}/.ci-bin/ultrafuzz
          ULTRAFUZZ_E2E_MODE: submission
        run: bash scripts/ci/run-target-e2e.sh "${{ matrix.target.id }}" "$GITHUB_WORKSPACE/.target-source"

      - name: Summarize bounded submission smoke
        if: always()
        run: |
          evidence=".codex-runs/e2e-targets/${{ matrix.target.id }}/evidence"
          if [ "${{ steps.bounded-submission.outcome }}" = "success" ] && \
            [ -s "$evidence/fake-smithers-invocation.json" ]; then
            {
              echo "### Bounded target submission passed"
              echo
              echo "Validated the pinned target through init, compile, validate, and workflow-runner submission."
              echo "No live agents were run and no finding report was produced."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bounded target submission did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultrafuzz-target-e2e-${{ matrix.target.id }}
          path: .codex-runs/e2e-targets/${{ matrix.target.id }}/evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

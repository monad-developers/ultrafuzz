name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    runs-on: ubuntu-latest
    env:
      ULTRAFUZZ_CODEX_REAL_DRY_RUN: "0"
      ULTRAFUZZ_RELEASE_DASHBOARD: "0"
      ULTRAFUZZ_RELEASE_REFERENCES: "0"
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm -w format:check

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Validate release
        run: pnpm -w validate:release

      - name: Upload release validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-report
          path: .ultrafuzz/release-validation.report.json
          if-no-files-found: ignore

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-gates:
    runs-on: ubuntu-latest
    env:
      ULTRAFUZZ_CODEX_REAL_DRY_RUN: "0"
      ULTRAFUZZ_RELEASE_DASHBOARD: "0"
      ULTRAFUZZ_RELEASE_REFERENCES: "0"
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm -w format:check

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Validate benchmark manifests and history charts
        run: pnpm -w benchmark:check

      - name: Validate release
        run: pnpm -w validate:release

      - name: Upload release validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-report
          path: .ultrafuzz/release-validation.report.json
          if-no-files-found: ignore

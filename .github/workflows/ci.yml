name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: CARGO_HOME=.cargo-home CARGO_TARGET_DIR=.cargo-target cargo check --workspace

      - name: Clippy
        run: CARGO_HOME=.cargo-home CARGO_TARGET_DIR=.cargo-target cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: CARGO_HOME=.cargo-home CARGO_TARGET_DIR=.cargo-target cargo test --workspace

  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/ultrafuzz-dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm ci

      - name: Format
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm run format:check

      - name: Lint
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm run lint

      - name: Test
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm run test

      - name: TypeScript
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm run typecheck

      - name: Build
        working-directory: crates/ultrafuzz-dashboard/frontend
        run: npm run build

  dashboard-smoke:
    name: Dashboard smoke
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/ultrafuzz-dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix crates/ultrafuzz-dashboard/frontend ci

      - name: Build frontend assets
        run: npm --prefix crates/ultrafuzz-dashboard/frontend run build

      - name: Install Playwright Chromium
        run: npm --prefix crates/ultrafuzz-dashboard/frontend exec -- playwright install --with-deps chromium

      - name: Verify embedded dashboard assets
        run: ULTRAFUZZ_DASHBOARD_REQUIRE_ASSETS=1 CARGO_HOME=.cargo-home CARGO_TARGET_DIR=.cargo-target cargo test -p ultrafuzz-dashboard

      - name: Browser smoke
        run: CARGO_HOME=.cargo-home CARGO_TARGET_DIR=.cargo-target npm --prefix crates/ultrafuzz-dashboard/frontend run smoke

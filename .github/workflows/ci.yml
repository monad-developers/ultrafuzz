name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-and-build-gates:
    name: "${{ github.event_name == 'pull_request' && 'PR build and Node.js 24 runtime smoke' || 'Build gates' }}"
    runs-on: ubuntu-latest
    # The PR path also runs the serial runtime and CLI contract smoke suites.
    # Under runner contention they completed successfully just after the former
    # 15-minute ceiling, so keep a bounded two-times completion budget.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CI policy scripts
        run: pnpm -w test:ci-scripts

      - name: Enforce production dependency advisory policy
        run: pnpm -w security:dependency-advisories

      - name: Check formatting
        run: pnpm -w format:check

      - name: Lint
        run: pnpm -w lint

      - name: Find dead code and dependencies
        run: pnpm -w knip

      - name: Build
        run: pnpm -w build

      - name: Lint changed code strictly
        env:
          ESLINT_PLUGIN_DIFF_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: pnpm -w lint:strict:ci

      - name: Enforce dashboard bundle budgets
        run: pnpm -w size

      - name: Run PR runtime smoke tests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @ultrafuzz/runtime test:pr-smoke:prebuilt

      - name: Run PR CLI status contract smoke tests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @ultrafuzz/cli test:pr-smoke:prebuilt

  external-static-analysis:
    name: External static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          MULTI_STATUS: false
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_CSS: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_JSONC: true
          VALIDATE_MARKDOWN: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_YAML: true

  # The lane table lives in scripts/ci/release-validation-lanes.mjs so the
  # pull-request policy is a tested artifact instead of an invisible `if:`.
  # While this job was gated off pull requests, every runtime test reported
  # `skipping` on a PR and resume-path regressions merged with all checks green.
  release-validation-lanes:
    name: Select release validation lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select release validation lanes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "lanes=$(node scripts/ci/release-validation-lanes.mjs --event "$EVENT_NAME")" >> "$GITHUB_OUTPUT"

  release-validation:
    name: Full release validation (${{ matrix.description }})
    needs:
      - draft-and-build-gates
      - external-static-analysis
      - release-validation-lanes
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.release-validation-lanes.outputs.lanes) }}
    env:
      ULTRAFUZZ_CODEX_REAL_DRY_RUN: "0"
      ULTRAFUZZ_RELEASE_DASHBOARD: "0"
      ULTRAFUZZ_RELEASE_REFERENCES: "0"
    steps:
      - name: Reclaim unused runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Modal-dependent lane dependencies
        if: matrix.build_modal_dependencies == true
        run: pnpm --filter @ultrafuzz/modal... build

      - name: Build release reporter dependencies
        if: matrix.build_release_reporter == true
        run: pnpm --filter @ultrafuzz/artifacts... build

      # The benchmark-history gate runs `benchmark:check:prebuilt`, which executes
      # packages/cli/dist/index.js without building it. It used to share a job with
      # the `cli` gate, whose own test script built the CLI closure first. Now that
      # the lanes are split, this lane has to build that closure itself.
      - name: Build CLI lane dependencies
        if: matrix.build_cli == true
        run: pnpm --filter @ultrafuzz/cli... build

      - name: Validate release lane
        run: >-
          pnpm -w validate:release --
          --gates "${{ matrix.gates }}"
          --report ".ultrafuzz/release-validation/${{ matrix.lane }}.json"

      - name: Upload release validation lane
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-report-${{ matrix.lane }}
          path: .ultrafuzz/release-validation/${{ matrix.lane }}.json
          if-no-files-found: error

  release-gates:
    needs:
      - draft-and-build-gates
      - external-static-analysis
      - release-validation-lanes
      - release-validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require draft and build gates
        if: needs.draft-and-build-gates.result != 'success'
        run: exit 1

      - name: Require external static analysis
        if: needs.external-static-analysis.result != 'success'
        run: exit 1

      - name: Require the release validation lane selection
        if: needs.release-validation-lanes.result != 'success'
        run: exit 1

      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        if: github.event_name != 'pull_request'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile

      - name: Build release reporter dependencies
        if: github.event_name != 'pull_request'
        run: pnpm --filter @ultrafuzz/artifacts... build

      - name: Download release validation lanes
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-validation-report-*
          path: .ultrafuzz/release-validation
          merge-multiple: true

      - name: Merge release validation report
        if: github.event_name != 'pull_request'
        run: >-
          node scripts/validate-release.mjs
          --merge-report-dir .ultrafuzz/release-validation
          --report .ultrafuzz/release-validation.report.json

      - name: Require release validation lanes
        if: always() && needs.release-validation.result != 'success'
        run: exit 1

      # validate:release already runs the config, runtime, and eval suites used by
      # benchmark:check. The built CLI is all that is needed for the remaining
      # byte-for-byte history/chart check, so do not run the long suites twice.
      - name: Validate benchmark history charts
        if: github.event_name != 'pull_request'
        run: pnpm -w benchmark:history:check

      - name: Upload release validation report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-report
          path: .ultrafuzz/release-validation.report.json
          if-no-files-found: error

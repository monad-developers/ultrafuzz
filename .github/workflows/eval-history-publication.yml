name: Publish Eval History

on:
  workflow_run:
    workflows:
      - Modal Eval Benchmarks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  qualify_modal_benchmark:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.qualify.outputs.eligible }}
      candidate_commit: ${{ steps.qualify.outputs.candidate_commit }}
      benchmark_mode: ${{ steps.qualify.outputs.benchmark_mode }}
      expected_provider: ${{ steps.qualify.outputs.expected_provider }}
      expected_model: ${{ steps.qualify.outputs.expected_model }}
      expected_reasoning: ${{ steps.qualify.outputs.expected_reasoning }}

    steps:
      - name: Check out trusted main qualification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Qualify the exact completed producer attempt
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs_path="$RUNNER_TEMP/modal-benchmark-producer-jobs.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT/jobs?per_page=100" \
            > "$jobs_path"
          node scripts/ci/qualify-modal-benchmark-publication.mjs \
            "$GITHUB_EVENT_PATH" \
            "$jobs_path" \
            "$GITHUB_OUTPUT" \
            "$GITHUB_REPOSITORY"

  publish_modal_benchmark:
    needs: qualify_modal_benchmark
    if: needs.qualify_modal_benchmark.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      generation_sha256: ${{ steps.prepare_publication.outputs.generation_sha256 }}
      handoff_artifact_id: ${{ steps.upload_publication_handoff.outputs.artifact-id }}
    env:
      BENCHMARK_MODE: ${{ needs.qualify_modal_benchmark.outputs.benchmark_mode }}
      EXPECTED_PROVIDER: ${{ needs.qualify_modal_benchmark.outputs.expected_provider }}
      EXPECTED_MODEL: ${{ needs.qualify_modal_benchmark.outputs.expected_model }}
      EXPECTED_REASONING: ${{ needs.qualify_modal_benchmark.outputs.expected_reasoning }}
      CANDIDATE_COMMIT: ${{ needs.qualify_modal_benchmark.outputs.candidate_commit }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      PUBLICATION_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Check out trusted main publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build trusted main
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Resolve the exact terminal benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="modal-benchmark-control-$BENCHMARK_MODE-$PRODUCER_RUN_ID-$PRODUCER_RUN_ATTEMPT"
          artifacts_path="$RUNNER_TEMP/modal-benchmark-terminal-artifacts.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?name=$artifact_name&per_page=100" \
            > "$artifacts_path"
          jq -e \
            --arg name "$artifact_name" \
            --argjson run_id "$PRODUCER_RUN_ID" \
            '.total_count == 1 and
             (.artifacts | length) == 1 and
             .artifacts[0].name == $name and
             .artifacts[0].expired == false and
             .artifacts[0].workflow_run.id == $run_id' \
            "$artifacts_path" > /dev/null

      - name: Download exact terminal benchmark control and results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-control-${{ env.BENCHMARK_MODE }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/trusted-modal-publication/terminal
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the terminal benchmark artifact layout
        env:
          TERMINAL_ARTIFACT: ${{ runner.temp }}/trusted-modal-publication/terminal
          BENCHMARK_CONTROL: ${{ runner.temp }}/trusted-modal-publication/terminal/benchmark-control
          BENCHMARK_RESULTS: ${{ runner.temp }}/trusted-modal-publication/terminal/benchmark-results
        run: |
          mapfile -d '' top_level < <(find "$TERMINAL_ARTIFACT" -mindepth 1 -maxdepth 1 -print0 | sort -z)
          if [ "${#top_level[@]}" -ne 2 ] || \
             [ "${top_level[0]}" != "$BENCHMARK_CONTROL" ] || \
             [ "${top_level[1]}" != "$BENCHMARK_RESULTS" ]; then
            echo "Terminal benchmark artifact must contain exactly benchmark-control and benchmark-results" >&2
            exit 1
          fi
          for directory in "$BENCHMARK_CONTROL" "$BENCHMARK_RESULTS"; do
            if [ ! -d "$directory" ] || [ -L "$directory" ]; then
              echo "Terminal benchmark artifact contains an invalid directory: $directory" >&2
              exit 1
            fi
          done
          mapfile -d '' manifests < <(find "$TERMINAL_ARTIFACT" -type f -name manifest.json -print0)
          if [ "${#manifests[@]}" -ne 1 ] || [ "${manifests[0]}" != "$BENCHMARK_CONTROL/manifest.json" ]; then
            echo "Terminal benchmark artifact must contain exactly one control manifest" >&2
            exit 1
          fi

      - name: Check out the exact candidate benchmark policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: eval-history-benchmark-policy
          persist-credentials: false

      - name: Verify the candidate remains reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comparison_status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE_COMMIT...main" \
            --jq '.status')"
          if [ "$comparison_status" != ahead ] && [ "$comparison_status" != identical ]; then
            echo "Benchmark candidate is no longer reachable from main" >&2
            exit 1
          fi

      - name: Validate the atomic Modal benchmark generation
        id: prepare_publication
        env:
          BENCHMARK_CONTROL: ${{ runner.temp }}/trusted-modal-publication/terminal/benchmark-control
          BENCHMARK_RESULTS: ${{ runner.temp }}/trusted-modal-publication/terminal/benchmark-results
          PUBLICATION_HANDOFF: ${{ runner.temp }}/eval-history-publication-handoff
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-publication-handoff/generation.json
          PUBLICATION_PLAN: ${{ runner.temp }}/eval-history-publication-plan.json
          PUBLICATION_POLICY_ROOT: ${{ github.workspace }}/eval-history-benchmark-policy
        run: |
          mkdir -m 700 "$PUBLICATION_HANDOFF"
          profile_args=()
          if [ -n "$EXPECTED_PROVIDER" ]; then
            profile_args=(--expected-provider "$EXPECTED_PROVIDER")
          fi
          if [ -n "$EXPECTED_MODEL" ] || [ -n "$EXPECTED_REASONING" ]; then
            if [ -z "$EXPECTED_MODEL" ] || [ -z "$EXPECTED_REASONING" ]; then
              echo "Expected benchmark model and reasoning must be supplied together" >&2
              exit 1
            fi
            profile_args+=(--expected-model "$EXPECTED_MODEL" --expected-reasoning "$EXPECTED_REASONING")
          fi
          node scripts/ci/prepare-eval-history-publication.mjs automatic \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_CONTROL" \
            "$BENCHMARK_RESULTS" \
            "$PUBLICATION_POLICY_ROOT" \
            "$CANDIDATE_COMMIT" \
            "$PUBLICATION_REPOSITORY" \
            "$PRODUCER_RUN_ID" \
            "$PRODUCER_RUN_ATTEMPT" \
            "$BENCHMARK_MODE" \
            "$PUBLICATION_GENERATION" \
            "$PUBLICATION_PLAN" \
            "${profile_args[@]}"
          generation_sha256="$(sha256sum "$PUBLICATION_GENERATION" | awk '{print $1}')"
          echo "generation_sha256=$generation_sha256" >> "$GITHUB_OUTPUT"

      - name: Unpack the digest-bound Modal benchmark generation
        env:
          BENCHMARK_RESULTS: ${{ runner.temp }}/trusted-modal-publication/terminal/benchmark-results
          PUBLICATION_PLAN: ${{ runner.temp }}/eval-history-publication-plan.json
          PUBLICATION_UNPACKED: ${{ runner.temp }}/eval-history-publication-handoff/unpacked
        run: |
          mkdir "$PUBLICATION_UNPACKED"
          while IFS=$'\t' read -r bundle_path bundle_sha256 unpack_path _publication_tree_sha256 eval_run_id benchmark lane model_slug; do
            node scripts/ci/prepare-eval-history-publication.mjs verify-bundle \
              "$BENCHMARK_RESULTS/$bundle_path" \
              "$bundle_sha256"
            metadata="$(node packages/modal/dist/cli.js unpack-public \
              --bundle "$BENCHMARK_RESULTS/$bundle_path" \
              --output "$PUBLICATION_UNPACKED/$unpack_path")"
            jq -e \
              --arg eval_run_id "$eval_run_id" \
              --arg benchmark "$benchmark" \
              --arg lane "$lane" \
              --arg model_slug "$model_slug" \
              --arg candidate_commit "$CANDIDATE_COMMIT" \
              '.eval_run_id == $eval_run_id and
               .benchmark == $benchmark and
               .lane == $lane and
               .model_slug == $model_slug and
               .candidate_commit == $candidate_commit' \
              <<< "$metadata" > /dev/null
          done < <(jq -r '.pairs[] | [.bundle_path, .bundle_sha256, .unpack_path, .publication_tree_sha256, .eval_run_id, .benchmark, .lane, .model_slug] | @tsv' \
            "$PUBLICATION_PLAN")
          node scripts/ci/prepare-eval-history-publication.mjs verify-unpacked \
            "$PUBLICATION_PLAN" \
            "$PUBLICATION_UNPACKED"

      - name: Validate the exact publication handoff layout
        env:
          PUBLICATION_HANDOFF: ${{ runner.temp }}/eval-history-publication-handoff
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-publication-handoff/generation.json
          PUBLICATION_UNPACKED: ${{ runner.temp }}/eval-history-publication-handoff/unpacked
        run: |
          mapfile -d '' top_level < <(find "$PUBLICATION_HANDOFF" -mindepth 1 -maxdepth 1 -print0 | sort -z)
          if [ "${#top_level[@]}" -ne 2 ] || \
             [ "${top_level[0]}" != "$PUBLICATION_GENERATION" ] || \
             [ "${top_level[1]}" != "$PUBLICATION_UNPACKED" ]; then
            echo "Publication handoff must contain exactly generation.json and unpacked" >&2
            exit 1
          fi
          if [ ! -f "$PUBLICATION_GENERATION" ] || [ -L "$PUBLICATION_GENERATION" ] || \
             [ ! -d "$PUBLICATION_UNPACKED" ] || [ -L "$PUBLICATION_UNPACKED" ]; then
            echo "Publication handoff contains an invalid generation or unpacked root" >&2
            exit 1
          fi
          if find "$PUBLICATION_HANDOFF" -type l -print -quit | grep -q .; then
            echo "Publication handoff must not contain symbolic links" >&2
            exit 1
          fi

      - name: Upload the sealed publication handoff
        id: upload_publication_handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-history-publication-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eval-history-publication-handoff
          if-no-files-found: error
          include-hidden-files: true
          overwrite: false
          retention-days: 1
          compression-level: 0

  publish_validated_modal_benchmark:
    needs:
      - qualify_modal_benchmark
      - publish_modal_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_COMMIT: ${{ needs.qualify_modal_benchmark.outputs.candidate_commit }}

    steps:
      - name: Check out fresh trusted main publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build fresh trusted main
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Check out the exact fresh candidate benchmark policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: eval-history-benchmark-policy
          persist-credentials: false

      - name: Download the exact sealed publication handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publish_modal_benchmark.outputs.handoff_artifact_id }}
          path: ${{ runner.temp }}/eval-history-publication-handoff

      - name: Validate the sealed publication handoff before token creation
        env:
          EXPECTED_GENERATION_SHA256: ${{ needs.publish_modal_benchmark.outputs.generation_sha256 }}
          EXPECTED_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PUBLICATION_HANDOFF: ${{ runner.temp }}/eval-history-publication-handoff
        run: |
          node scripts/ci/publish-eval-history-cas.mjs validate-handoff \
            "$PUBLICATION_HANDOFF" \
            "$EXPECTED_GENERATION_SHA256" \
            "$CANDIDATE_COMMIT" \
            "$EXPECTED_REPOSITORY_URL"

      - name: Verify fresh tooling, candidate policy, and main reachability
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_POLICY_ROOT: ${{ github.workspace }}/eval-history-benchmark-policy
        run: |
          tooling_head="$(git rev-parse HEAD)"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Remote main did not resolve to a full commit SHA" >&2
            exit 1
          fi
          if [ "$tooling_head" != "$remote_main" ]; then
            echo "Trusted main publication tooling moved during handoff validation" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain=v1 --untracked-files=no)" ]; then
            echo "Trusted main publication tooling has tracked modifications" >&2
            exit 1
          fi
          if [ "$(git -C "$PUBLICATION_POLICY_ROOT" rev-parse HEAD)" != "$CANDIDATE_COMMIT" ] || \
             [ -n "$(git -C "$PUBLICATION_POLICY_ROOT" status --porcelain=v1 --untracked-files=no)" ]; then
            echo "Candidate benchmark policy checkout drifted" >&2
            exit 1
          fi
          comparison_status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE_COMMIT...main" \
            --jq '.status')"
          if [ "$comparison_status" != ahead ] && [ "$comparison_status" != identical ]; then
            echo "Benchmark candidate is no longer reachable from main" >&2
            exit 1
          fi

      - name: Create the narrowly scoped eval-history publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EVAL_HISTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.EVAL_HISTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          skip-token-revoke: false

      - name: Publish the validated generation with remote-tip compare-and-swap retries
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
          EXPECTED_GENERATION_SHA256: ${{ needs.publish_modal_benchmark.outputs.generation_sha256 }}
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-publication-handoff/generation.json
          PUBLICATION_POLICY_ROOT: ${{ github.workspace }}/eval-history-benchmark-policy
          PUBLICATION_UNPACKED: ${{ runner.temp }}/eval-history-publication-handoff/unpacked
        run: |
          node scripts/ci/publish-eval-history-cas.mjs \
            "$PUBLICATION_GENERATION" \
            "$PUBLICATION_UNPACKED" \
            "$PUBLICATION_POLICY_ROOT" \
            "$EXPECTED_GENERATION_SHA256"

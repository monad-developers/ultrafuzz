name: Publish Eval History

on:
  workflow_run:
    workflows:
      - Modal Eval Benchmarks
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  qualify_modal_benchmark:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      eligible: ${{ steps.qualify.outputs.eligible }}
      candidate_commit: ${{ steps.qualify.outputs.candidate_commit }}
      benchmark_mode: ${{ steps.qualify.outputs.benchmark_mode }}

    steps:
      - name: Check out trusted main qualification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Qualify the exact completed producer attempt
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs_path="$RUNNER_TEMP/modal-benchmark-producer-jobs.json"
          artifacts_path="$RUNNER_TEMP/modal-benchmark-producer-artifacts.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_RUN_ATTEMPT/jobs?per_page=100" \
            > "$jobs_path"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100" \
            > "$artifacts_path"
          node scripts/ci/qualify-modal-benchmark-publication.mjs \
            "$GITHUB_EVENT_PATH" \
            "$jobs_path" \
            "$artifacts_path" \
            "$GITHUB_OUTPUT" \
            "$GITHUB_REPOSITORY"

  publish_modal_benchmark:
    needs: qualify_modal_benchmark
    if: needs.qualify_modal_benchmark.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_MODE: ${{ needs.qualify_modal_benchmark.outputs.benchmark_mode }}
      CANDIDATE_COMMIT: ${{ needs.qualify_modal_benchmark.outputs.candidate_commit }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      PUBLICATION_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Check out trusted main publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build trusted main
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Download exact benchmark control metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ env.BENCHMARK_MODE }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/trusted-modal-publication/control
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download exact public benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-benchmark-results-${{ env.BENCHMARK_MODE }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/trusted-modal-publication/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check out the exact candidate benchmark policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          path: eval-history-benchmark-policy
          persist-credentials: false

      - name: Verify the candidate remains reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comparison_status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE_COMMIT...main" \
            --jq '.status')"
          if [ "$comparison_status" != ahead ] && [ "$comparison_status" != identical ]; then
            echo "Benchmark candidate is no longer reachable from main" >&2
            exit 1
          fi

      - name: Validate the atomic Modal benchmark generation
        env:
          BENCHMARK_CONTROL: ${{ runner.temp }}/trusted-modal-publication/control
          BENCHMARK_RESULTS: ${{ runner.temp }}/trusted-modal-publication/results
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-generation.json
          PUBLICATION_PLAN: ${{ runner.temp }}/eval-history-publication-plan.json
          PUBLICATION_POLICY_ROOT: ${{ github.workspace }}/eval-history-benchmark-policy
          PUBLICATION_UNPACKED: ${{ runner.temp }}/trusted-modal-publication/unpacked
        run: |
          node scripts/ci/prepare-eval-history-publication.mjs automatic \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_CONTROL" \
            "$BENCHMARK_RESULTS" \
            "$PUBLICATION_POLICY_ROOT" \
            "$CANDIDATE_COMMIT" \
            "$PUBLICATION_REPOSITORY" \
            "$PRODUCER_RUN_ID" \
            "$PRODUCER_RUN_ATTEMPT" \
            "$BENCHMARK_MODE" \
            "$PUBLICATION_GENERATION" \
            "$PUBLICATION_PLAN"
          publication_rows="$RUNNER_TEMP/eval-history-publication-rows.tsv"
          node scripts/ci/prepare-eval-history-publication.mjs plan-rows "$PUBLICATION_PLAN" > "$publication_rows"
          mkdir "$PUBLICATION_UNPACKED"
          while IFS=$'\t' read -r bundle_path unpack_path eval_run_id benchmark lane model_slug; do
            metadata="$(node packages/modal/dist/cli.js unpack-public \
              --bundle "$BENCHMARK_RESULTS/$bundle_path" \
              --output "$PUBLICATION_UNPACKED/$unpack_path")"
            jq -e \
              --arg eval_run_id "$eval_run_id" \
              --arg benchmark "$benchmark" \
              --arg lane "$lane" \
              --arg model_slug "$model_slug" \
              --arg candidate_commit "$CANDIDATE_COMMIT" \
              '.eval_run_id == $eval_run_id and
               .benchmark == $benchmark and
               .lane == $lane and
               .model_slug == $model_slug and
               .candidate_commit == $candidate_commit' \
              <<< "$metadata" > /dev/null
          done < "$publication_rows"

      - name: Create the narrowly scoped eval-history publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EVAL_HISTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.EVAL_HISTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          skip-token-revoke: false

      - name: Publish the validated generation with remote-tip compare-and-swap retries
        env:
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-generation.json
          PUBLICATION_POLICY_ROOT: ${{ github.workspace }}/eval-history-benchmark-policy
          PUBLICATION_UNPACKED: ${{ runner.temp }}/trusted-modal-publication/unpacked
        run: |
          publisher_basic="$(printf 'x-access-token:%s' "$PUBLISHER_TOKEN" | base64 -w 0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $publisher_basic" \
            node scripts/ci/publish-eval-history-cas.mjs \
              "$PUBLICATION_GENERATION" \
              "$PUBLICATION_UNPACKED" \
              "$PUBLICATION_POLICY_ROOT"

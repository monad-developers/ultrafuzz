name: Eval Benchmark Generation

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      lane:
        description: Benchmark lane
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-eval-history
  cancel-in-progress: false

jobs:
  classify_history_change:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      run_benchmarks: ${{ steps.scope.outputs.run_benchmarks }}

    steps:
      - name: Check out the successful candidate
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Classify the candidate change
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "run_benchmarks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_files="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "run_benchmarks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publication_file=false
          unrelated_file=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              benchmarks/history.json|docs/assets/eval-history/*)
                publication_file=true
                ;;
              README.md)
                ;;
              "")
                ;;
              *)
                unrelated_file=true
                ;;
            esac
          done <<< "$changed_files"

          if [ "$publication_file" = true ] && [ "$unrelated_file" = false ]; then
            echo "run_benchmarks=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_benchmarks=true" >> "$GITHUB_OUTPUT"
          fi

  benchmark-and-publish:
    needs: classify_history_change
    if: needs.classify_history_change.outputs.run_benchmarks == 'true'
    runs-on:
      - self-hosted
      - ultrafuzz-benchmark
    timeout-minutes: 4320

    steps:
      - name: Check out the successful candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Run and score complete benchmark generations
        run: |
          lane="${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && inputs.lane || 'smoke' }}"
          candidate="$(git rev-parse --short=12 HEAD)"
          generation="${{ github.run_id }}-${{ github.run_attempt }}"

          for benchmark in evmbench ultrafuzz-bench; do
            suite="${{ runner.temp }}/${benchmark}-${lane}.yml"
            eval_run_id="benchmark-${benchmark}-${lane}-${candidate}-${generation}"
            target_root="/opt/ultrafuzz-benchmark/targets/${benchmark}"
            node scripts/ci/prepare-eval-benchmark.mjs "$benchmark" "$lane" "$suite" "$target_root"
            node packages/cli/dist/index.js eval run \
              --project . \
              --suite "$suite" \
              --eval-run-id "$eval_run_id" \
              --target-root "$target_root" \
              --ground-truth-root "/opt/ultrafuzz-benchmark/ground-truth/${benchmark}" \
              --provider none
            node packages/cli/dist/index.js eval score "$eval_run_id" --project .
          done

      - name: Preserve history already pending in the publication pull request
        run: |
          if git fetch --no-tags origin "automation/eval-history:refs/remotes/origin/automation/eval-history"; then
            node scripts/ci/merge-pending-eval-history.mjs origin/automation/eval-history
          fi

      - name: Append complete generations and regenerate charts
        run: |
          lane="${{ github.event_name == 'schedule' && 'full' || github.event_name == 'workflow_dispatch' && inputs.lane || 'smoke' }}"
          candidate="$(git rev-parse --short=12 HEAD)"
          generation="${{ github.run_id }}-${{ github.run_attempt }}"

          for benchmark in evmbench ultrafuzz-bench; do
            eval_run_id="benchmark-${benchmark}-${lane}-${candidate}-${generation}"
            node packages/cli/dist/index.js eval history "$eval_run_id" \
              --project . \
              --benchmark "$benchmark" \
              --lane "$lane" \
              --repository "${{ github.server_url }}/${{ github.repository }}" \
              --artifact "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

          node packages/cli/dist/index.js eval history --project . --check

      - name: Open or update the publication pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/eval-history
          base: main
          delete-branch: false
          draft: false
          commit-message: "Update published eval history [skip eval-history]"
          title: "[skip eval-history] Update published eval history"
          body: |
            ## Summary

            Append complete scored benchmark generations and regenerate the deterministic README charts.

            ## Verification

            - Validated the pinned cohort and lane manifests
            - Published only complete, successfully scored generations
            - Regenerated and checked all SVGs from versioned history
          add-paths: |
            benchmarks/history.json
            docs/assets/eval-history/*.svg

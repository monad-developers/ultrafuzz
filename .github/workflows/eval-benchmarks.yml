name: Modal Eval Benchmarks

on:
  push:
    branches:
      - main
    paths-ignore:
      - benchmarks/ultrafuzzbench/history.json
      - benchmarks/ultrafuzzbench/results/**
      - docs/assets/eval-history/**
  workflow_dispatch:
    inputs:
      benchmark_mode:
        description: >-
          Which lane to dispatch. `smoke` runs one selected runner over the three smoke targets;
          `full` is the EVMBench model matrix; `threat-model` is the v0.1.0 release gate from #183:
          the pinned three-target Ultrafuzz-bench cohort through the PRODUCTION topology, so the
          threat-model, goal-plan and dynamic goal-fanout nodes actually run. The threat-model lane
          ignores every model input below and uses the checked-in benchmarks/ultrafuzzbench/lanes.json profile
          (OpenAI gpt-5.6-luna / high), and it is never published to longitudinal history. It costs
          real money: confirm an owner and a compute budget before dispatching.
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
          - threat-model
      smoke_provider:
        description: smoke lane only, runner provider
        required: true
        default: deepseek
        type: choice
        options:
          - openai
          - anthropic
          - deepseek
          - kimi
          - openrouter
      smoke_model:
        description: smoke lane only, runner model
        required: true
        default: deepseek-v4-flash
        type: string
      smoke_reasoning:
        description: smoke lane only, runner reasoning effort
        required: true
        default: max
        type: string
      openai_model:
        description: OpenAI runner model for the full EVMBench run
        required: true
        default: gpt-5.6-luna
        type: string
      openai_reasoning:
        description: OpenAI runner reasoning effort for the full EVMBench run
        required: true
        default: high
        type: string
      anthropic_model:
        description: Anthropic runner model for the full EVMBench run
        required: true
        default: claude-sonnet-5
        type: string
      anthropic_reasoning:
        description: Anthropic runner reasoning effort for the full EVMBench run
        required: true
        default: high
        type: string
      kimi_model:
        description: Kimi runner model for the full EVMBench run
        required: true
        default: kimi-k3
        type: string
      kimi_reasoning:
        description: Kimi runner reasoning effort for the full EVMBench run
        required: true
        default: max
        type: string
      deepseek_model:
        description: DeepSeek runner model for the full EVMBench run
        required: true
        default: deepseek-v4-pro
        type: string
      deepseek_reasoning:
        description: DeepSeek runner reasoning effort for the full EVMBench run
        required: true
        default: max
        type: string

env:
  BENCHMARK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_mode || 'smoke' }}
  BENCHMARK_CANDIDATE: ${{ github.event_name == 'push' && github.event.after || github.sha }}

permissions:
  actions: read
  contents: read

concurrency:
  group: modal-eval-${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_mode || 'smoke' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  launch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.deleted == false)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control

    steps:
      - name: Check out the exact benchmark candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false

      # Keep the selected lane visible in the job metadata for operators. The
      # publication qualifier independently derives it from exact-run artifacts.
      - name: Benchmark lane ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_mode || 'smoke' }}
        run: echo "Dispatching the $BENCHMARK_MODE benchmark lane"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Validate benchmark credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
          KIMI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_API_KEY || github.event_name == 'workflow_dispatch' && secrets.MOONSHOT_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
          KIMI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_BASE_URL || github.event_name == 'workflow_dispatch' && vars.KIMI_BASE_URL || '' }}
          BENCHMARK_SMOKE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && (inputs.smoke_provider || 'openai') || 'openai' }}
        run: |
          # The judge profile is always gpt-5.6-sol on CodexAgent, so OPENAI_API_KEY is
          # required for every lane regardless of which runner provider is selected.
          required=(MODAL_TOKEN_ID MODAL_TOKEN_SECRET OPENAI_API_KEY)
          if [ "$BENCHMARK_MODE" = full ]; then
            required+=(ANTHROPIC_API_KEY KIMI_API_KEY DEEPSEEK_API_KEY)
          elif [ "$BENCHMARK_MODE" = smoke ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$BENCHMARK_SMOKE_PROVIDER" in
              anthropic) required+=(ANTHROPIC_API_KEY) ;;
              deepseek) required+=(DEEPSEEK_API_KEY) ;;
              kimi) required+=(KIMI_API_KEY) ;;
              openrouter) required+=(OPENROUTER_API_KEY) ;;
            esac
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Required benchmark secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Prepare the exact model by benchmark matrix
        env:
          BENCHMARK_OPENAI_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.openai_model || vars.BENCHMARK_SMOKE_OPENAI_MODEL || 'gpt-5.6-luna' }}
          BENCHMARK_OPENAI_REASONING: ${{ github.event_name == 'workflow_dispatch' && inputs.openai_reasoning || 'high' }}
          BENCHMARK_ANTHROPIC_MODEL: ${{ inputs.anthropic_model || 'claude-sonnet-5' }}
          BENCHMARK_ANTHROPIC_REASONING: ${{ inputs.anthropic_reasoning || 'high' }}
          BENCHMARK_KIMI_MODEL: ${{ inputs.kimi_model || 'kimi-k3' }}
          BENCHMARK_KIMI_REASONING: ${{ inputs.kimi_reasoning || 'max' }}
          BENCHMARK_DEEPSEEK_MODEL: ${{ inputs.deepseek_model || 'deepseek-v4-pro' }}
          BENCHMARK_DEEPSEEK_REASONING: ${{ inputs.deepseek_reasoning || 'max' }}
          BENCHMARK_SMOKE_PROVIDER: ${{ inputs.benchmark_mode == 'smoke' && (inputs.smoke_provider || 'openai') || 'openai' }}
          BENCHMARK_SMOKE_MODEL: ${{ inputs.benchmark_mode == 'smoke' && inputs.smoke_model || '' }}
          BENCHMARK_SMOKE_REASONING: ${{ inputs.benchmark_mode == 'smoke' && inputs.smoke_reasoning || '' }}
        run: |
          candidate="$(git rev-parse HEAD)"
          generation="${{ github.run_id }}-${{ github.run_attempt }}"
          # The release gate has a fixed model identity (#183). Leaving the matrix
          # unset makes prepare-modal-benchmarks.mjs fall back to the lane's own
          # checked-in profile, so no dispatch-form value can retune the gate.
          if [ "$BENCHMARK_MODE" = threat-model ]; then
            unset BENCHMARK_MODELS_JSON
          elif [ "$BENCHMARK_MODE" = smoke ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A dispatched smoke run uses the requested single runner. Its targets,
            # loops, topology transform, and judge remain pinned by the smoke lane.
            BENCHMARK_MODELS_JSON="$(jq -cn \
              --arg provider "$BENCHMARK_SMOKE_PROVIDER" \
              --arg model "$BENCHMARK_SMOKE_MODEL" \
              --arg reasoning "$BENCHMARK_SMOKE_REASONING" \
              '[{provider: $provider, model: $model, reasoning: $reasoning}]')"
          elif [ "$BENCHMARK_MODE" = smoke ]; then
            BENCHMARK_MODELS_JSON="$(jq -cn \
              --arg model "$BENCHMARK_OPENAI_MODEL" \
              --arg reasoning "high" \
              '[{provider: "openai", model: $model, reasoning: $reasoning}]')"
          else
            BENCHMARK_MODELS_JSON="$(jq -cn \
              --arg openai_model "$BENCHMARK_OPENAI_MODEL" \
              --arg openai_reasoning "$BENCHMARK_OPENAI_REASONING" \
              --arg anthropic_model "$BENCHMARK_ANTHROPIC_MODEL" \
              --arg anthropic_reasoning "$BENCHMARK_ANTHROPIC_REASONING" \
              --arg kimi_model "$BENCHMARK_KIMI_MODEL" \
              --arg kimi_reasoning "$BENCHMARK_KIMI_REASONING" \
              --arg deepseek_model "$BENCHMARK_DEEPSEEK_MODEL" \
              --arg deepseek_reasoning "$BENCHMARK_DEEPSEEK_REASONING" \
              '[
                {provider: "openai", model: $openai_model, reasoning: $openai_reasoning},
                {provider: "anthropic", model: $anthropic_model, reasoning: $anthropic_reasoning},
                {provider: "kimi", model: $kimi_model, reasoning: $kimi_reasoning},
                {provider: "deepseek", model: $deepseek_model, reasoning: $deepseek_reasoning}
              ]')"
          fi
          export BENCHMARK_MODELS_JSON
          node scripts/ci/prepare-modal-benchmarks.mjs \
            "$candidate" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "$generation" \
            "$BENCHMARK_CONTROL" \
            "$BENCHMARK_MODE"

      - name: Validate Modal benchmark launch guardrails
        run: |
          node scripts/ci/validate-modal-benchmark-launch.mjs \
            "$BENCHMARK_CONTROL/manifest.json" \
            . \
            "$BENCHMARK_MODE"

      - name: Persist immutable benchmark plan before starting Modal compute
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-plan-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Build an immutable Modal image for the candidate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          image_name="$(jq -r '.image_name' "$BENCHMARK_CONTROL/manifest.json")"
          node packages/modal/dist/cli.js build \
            --image "$image_name" \
            --build-scope "${{ github.run_id }}-${{ github.run_attempt }}" \
            --repo-root .

      - name: Launch detached Modal benchmark sandboxes
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
          KIMI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_API_KEY || github.event_name == 'workflow_dispatch' && secrets.MOONSHOT_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
          KIMI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_BASE_URL || github.event_name == 'workflow_dispatch' && vars.KIMI_BASE_URL || '' }}
        run: |
          : > "$BENCHMARK_CONTROL/launch-attempts.jsonl"
          while IFS=$'\t' read -r config state pair; do
            launch_outcome=succeeded
            launch_category=launched
            if ! timeout --signal=TERM --kill-after=30s 20m \
              node packages/modal/dist/cli.js launch \
              --config "$BENCHMARK_CONTROL/$config" \
              --state "$BENCHMARK_CONTROL/$state" \
              --mode fresh \
              --repo-root .; then
              launch_outcome=failed
              launch_category=initial-launch-failed
              echo "Initial detached launch failed for $pair; continuing with the remaining pairs" >&2
            fi
            jq -cn \
              --arg pair "$pair" \
              --arg state "$state" \
              --arg outcome "$launch_outcome" \
              --arg category "$launch_category" \
              '{pair: $pair, state_path: $state, outcome: $outcome, category: $category}' \
              >> "$BENCHMARK_CONTROL/launch-attempts.jsonl"
          done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")

      - name: Seal the absolute Modal control deadline
        run: |
          candidate="$(git rev-parse HEAD)"
          node scripts/ci/modal-benchmark-control-window.mjs create \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_CONTROL/control-window.json" \
            "$candidate" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$BENCHMARK_MODE"

      - name: Persist detached launch state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-launch-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  monitor_full:
    needs: launch
    if: >-
      !cancelled() &&
      needs.launch.result != 'skipped' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.benchmark_mode || 'full') == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control
      # Leave five hours of the one 37,500-second full-lane window for the
      # final hosted job. The first phase therefore uses at most 19,500 seconds
      # (5h25m), leaving 35 minutes below its own six-hour hosted limit for the
      # handoff and 60 minutes in the final job for setup, collection and upload.
      FULL_FINAL_CONTROL_RESERVE_SECONDS: 18000

    steps:
      - name: Check out the benchmark candidate for full monitoring
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore the exact detached launch state for full monitoring
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Validate restored full benchmark control and deadline
        run: |
          node scripts/ci/validate-modal-benchmark-launch.mjs \
            "$BENCHMARK_CONTROL/manifest.json" \
            . \
            full
          node scripts/ci/modal-benchmark-control-window.mjs deadline \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_CONTROL/control-window.json" \
            "$BENCHMARK_CANDIDATE" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            full

      - name: Monitor the first bounded full control phase
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY || secrets.MOONSHOT_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL || vars.KIMI_BASE_URL }}
        run: |
          bash scripts/ci/watch-modal-benchmark.sh \
            "$BENCHMARK_CONTROL" \
            . \
            "$BENCHMARK_CANDIDATE" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            full \
            "$FULL_FINAL_CONTROL_RESERVE_SECONDS"

      - name: Persist the full control-plane handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-handoff-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  collect:
    needs:
      - launch
      - monitor_full
    if: >-
      !cancelled() &&
      needs.launch.result != 'skipped' &&
      (needs.monitor_full.result == 'success' || needs.monitor_full.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      incomplete: ${{ steps.final_gate.outputs.incomplete }}
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control
      BENCHMARK_RESULTS: ${{ github.workspace }}/ci-modal/benchmark-results

    steps:
      - name: Check out the benchmark candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore the exact detached launch state
        id: restore_launch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-launch
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore the exact full control-plane handoff
        id: restore_handoff
        if: env.BENCHMARK_MODE == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-handoff-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-handoff
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Assemble control from the authoritative launch artifact
        if: >-
          steps.restore_launch.outcome == 'success' &&
          (env.BENCHMARK_MODE == 'smoke' || steps.restore_handoff.outcome == 'success')
        run: |
          launch_root='${{ github.workspace }}/ci-modal/benchmark-launch'
          handoff_root='${{ github.workspace }}/ci-modal/benchmark-handoff'
          control_root='${{ github.workspace }}/ci-modal/benchmark-control'

          node scripts/ci/validate-modal-benchmark-launch.mjs \
            "$launch_root/manifest.json" \
            . \
            "$BENCHMARK_MODE"
          node scripts/ci/modal-benchmark-control-window.mjs deadline \
            "$launch_root/manifest.json" \
            "$launch_root/control-window.json" \
            "$BENCHMARK_CANDIDATE" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$BENCHMARK_MODE"

          immutable_paths=(manifest.json control-window.json launch-attempts.jsonl)
          mutable_paths=()
          path_is_listed() {
            local candidate="$1"
            shift
            local listed
            for listed in "$@"; do
              if [ "$candidate" = "$listed" ]; then
                return 0
              fi
            done
            return 1
          }
          while IFS=$'\t' read -r config state pair; do
            immutable_paths+=("$config")
            mutable_paths+=("$state" "$pair.status.json" "outcomes/$pair.json")
          done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$launch_root/manifest.json")

          if [ "$BENCHMARK_MODE" = full ]; then
            for relative in "${immutable_paths[@]}"; do
              if ! cmp --silent -- "$launch_root/$relative" "$handoff_root/$relative"; then
                echo "Full monitor handoff changed immutable launch control: $relative" >&2
                exit 1
              fi
            done
            if find "$handoff_root" ! -type d ! -type f -print -quit | grep -q .; then
              echo "Full monitor handoff contains a non-regular filesystem entry" >&2
              exit 1
            fi
          fi

          mkdir -p "$control_root"
          cp -a -- "$launch_root"/. "$control_root"/
          if [ "$BENCHMARK_MODE" = full ]; then
            while IFS= read -r -d '' source; do
              relative="${source#"$handoff_root"/}"
              if path_is_listed "$relative" "${immutable_paths[@]}"; then
                continue
              fi
              if ! path_is_listed "$relative" "${mutable_paths[@]}" && \
                 [[ "$relative" != diagnostics/* ]] && \
                 [[ "$relative" != failures/* ]]; then
                echo "Full monitor handoff contains an unsupported mutable path: $relative" >&2
                exit 1
              fi
              destination="$control_root/$relative"
              mkdir -p "$(dirname "$destination")"
              cp -- "$source" "$destination"
            done < <(find "$handoff_root" -type f -print0)
          fi

      - name: Discover recoverable launch control
        id: launch_control
        if: always()
        run: |
          mkdir -p "$BENCHMARK_CONTROL/diagnostics" "$BENCHMARK_CONTROL/failures" "$BENCHMARK_CONTROL/outcomes" "$BENCHMARK_RESULTS"
          if [ -f "$BENCHMARK_CONTROL/manifest.json" ] && [ -f "$BENCHMARK_CONTROL/control-window.json" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg category "launch-control-unavailable" \
              '{terminal_status: "failed", category: $category}' \
              > "$BENCHMARK_CONTROL/failures/launch-control-unavailable.json"
          fi

      - name: Validate restored benchmark control and absolute deadline
        id: validate_control
        if: steps.launch_control.outputs.available == 'true'
        run: |
          node scripts/ci/validate-modal-benchmark-launch.mjs \
            "$BENCHMARK_CONTROL/manifest.json" \
            . \
            "$BENCHMARK_MODE"
          node scripts/ci/modal-benchmark-control-window.mjs deadline \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_CONTROL/control-window.json" \
            "$BENCHMARK_CANDIDATE" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$BENCHMARK_MODE"

      - name: Wait for Modal compute and retry only pre-model launch failures
        if: steps.validate_control.outcome == 'success'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
          KIMI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_API_KEY || github.event_name == 'workflow_dispatch' && secrets.MOONSHOT_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
          KIMI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_BASE_URL || github.event_name == 'workflow_dispatch' && vars.KIMI_BASE_URL || '' }}
        run: |
          bash scripts/ci/watch-modal-benchmark.sh \
            "$BENCHMARK_CONTROL" \
            . \
            "$BENCHMARK_CANDIDATE" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$BENCHMARK_MODE" \
            0

      - name: Collect and validate public finding bundles
        if: always() && steps.validate_control.outcome == 'success'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
          KIMI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_API_KEY || github.event_name == 'workflow_dispatch' && secrets.MOONSHOT_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
          KIMI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && secrets.KIMI_BASE_URL || github.event_name == 'workflow_dispatch' && vars.KIMI_BASE_URL || '' }}
        run: |
          mkdir -p "$BENCHMARK_RESULTS"
          collect_pair() {
            local config="$1"
            local state="$2"
            local pair="$3"
            outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
            if [ ! -f "$outcome_file" ] || ! jq -e '.terminal_status == "succeeded"' "$outcome_file" > /dev/null; then
              diagnostic_exit=0
              timeout --signal=TERM --kill-after=30s 5m \
                node packages/modal/dist/cli.js collect \
                --config "$BENCHMARK_CONTROL/$config" \
                --state "$BENCHMARK_CONTROL/$state" \
                --output "$BENCHMARK_RESULTS/$pair" || diagnostic_exit=$?
              if [ -f "$outcome_file" ]; then
                if [ "$diagnostic_exit" -eq 0 ]; then
                  jq '.diagnostic_collection_status = "succeeded"' "$outcome_file" > "$outcome_file.tmp"
                else
                  jq '.diagnostic_collection_status = "failed"' "$outcome_file" > "$outcome_file.tmp"
                fi
                mv "$outcome_file.tmp" "$outcome_file"
              fi
              return 0
            fi
            collection_exit=0
            timeout --signal=TERM --kill-after=30s 5m \
              node packages/modal/dist/cli.js collect \
              --config "$BENCHMARK_CONTROL/$config" \
              --state "$BENCHMARK_CONTROL/$state" \
              --output "$BENCHMARK_RESULTS/$pair" \
              --public-results || collection_exit=$?
            if [ "$collection_exit" -eq 0 ]; then
              jq '.collection_status = "succeeded"' "$outcome_file" > "$outcome_file.tmp"
              mv "$outcome_file.tmp" "$outcome_file"
            else
              diagnostic_exit=0
              timeout --signal=TERM --kill-after=30s 5m \
                node packages/modal/dist/cli.js collect \
                --config "$BENCHMARK_CONTROL/$config" \
                --state "$BENCHMARK_CONTROL/$state" \
                --output "$BENCHMARK_RESULTS/$pair" || diagnostic_exit=$?
              diagnostic_status=failed
              if [ "$diagnostic_exit" -eq 0 ]; then
                diagnostic_status=succeeded
              fi
              collection_category=collection-failed
              if [ "$collection_exit" -eq 124 ] || [ "$collection_exit" -eq 137 ]; then
                collection_category=collection-timeout
              fi
              jq \
                --arg category "$collection_category" \
                --arg diagnostic_status "$diagnostic_status" \
                '.terminal_status = "failed" | .collection_status = "failed" | .diagnostic_collection_status = $diagnostic_status | .category = $category' \
                "$outcome_file" > "$outcome_file.tmp"
              mv "$outcome_file.tmp" "$outcome_file"
            fi
          }

          max_parallel_collections=4
          active_collections=0
          while IFS=$'\t' read -r config state pair; do
            collect_pair "$config" "$state" "$pair" &
            active_collections=$((active_collections + 1))
            if (( active_collections >= max_parallel_collections )); then
              wait -n
              active_collections=$((active_collections - 1))
            fi
          done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
          wait

      - name: Upload public benchmark reports and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark-results-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-modal/benchmark-results
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload launch state and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-control-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/ci-modal/benchmark-control
            ${{ github.workspace }}/ci-modal/benchmark-results
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Validate threat-model structural gate
        if: always() && env.BENCHMARK_MODE == 'threat-model'
        run: |
          node scripts/ci/validate-threat-model-benchmark-gate.mjs \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_RESULTS"

      - name: Fail an incomplete matrix after preserving artifacts
        id: final_gate
        if: always()
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF_NAME: ${{ github.ref_name }}
        run: |
          matrix_failed=false
          matrix_incomplete=false
          # A recoverable operational pair failure is not scoring evidence, so
          # an automatic post-merge smoke run keeps it visible without turning
          # CI red. Manual runs, task outcomes, and control/integrity failures
          # stay strict. The executable policy lives in
          # describe-smoke-soft-fail.mjs so event, mode, and outcome handling
          # are covered together (#554).
          if [ ! -f "$BENCHMARK_CONTROL/manifest.json" ]; then
            echo "Detached launch control was unavailable" >&2
            matrix_failed=true
          else
            expected_attempts="$(jq '.pairs | length' "$BENCHMARK_CONTROL/manifest.json")"
            actual_attempts=0
            if [ -f "$BENCHMARK_CONTROL/launch-attempts.jsonl" ]; then
              actual_attempts="$(jq -s 'length' "$BENCHMARK_CONTROL/launch-attempts.jsonl")"
            fi
            if [ "$actual_attempts" -ne "$expected_attempts" ]; then
              echo "Attempted $actual_attempts of $expected_attempts detached pair launches" >&2
              matrix_failed=true
            fi

            while IFS=$'\t' read -r pair slug; do
              outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
              bundle="$BENCHMARK_RESULTS/$pair/$slug/public-results.json"
              if [ ! -f "$outcome_file" ]; then
                echo "Modal pair $pair did not finish and collect successfully" >&2
                matrix_failed=true
              elif jq -e '.terminal_status == "succeeded" and .collection_status == "succeeded"' \
                "$outcome_file" > /dev/null; then
                if [ ! -f "$bundle" ]; then
                  echo "Modal pair $pair is missing its validated public result bundle" >&2
                  matrix_failed=true
                fi
              else
                matrix_incomplete=true
                soft_fail_category="$(jq -r '.category' "$outcome_file")"
                readiness_decision="$(node scripts/ci/describe-smoke-soft-fail.mjs --json \
                  --ref "$CI_REF_NAME" \
                  --mode "$BENCHMARK_MODE" \
                  --event "$CI_EVENT_NAME" \
                  --outcome "$outcome_file" \
                  "$BENCHMARK_RESULTS/$pair/$slug/public-eval-diagnostics.json")"
                readiness="$(jq -r '.detail' <<< "$readiness_decision")"
                if jq -e '.soft_fail != true' <<< "$readiness_decision" > /dev/null; then
                  echo "Modal pair $pair did not finish and collect successfully" >&2
                  matrix_failed=true
                elif jq -e '.blocks_gate == true' <<< "$readiness_decision" > /dev/null; then
                  echo "::error::Modal smoke pair $pair failed operationally as $soft_fail_category; blocking validation-ref smoke gate because scoring readiness is required — $readiness"
                  echo "Modal smoke pair $pair failed operationally as $soft_fail_category; blocking validation-ref smoke gate because scoring readiness is required — $readiness" >&2
                  matrix_failed=true
                elif jq -e '.scoring_ready_required == true' <<< "$readiness_decision" > /dev/null; then
                  echo "::warning::Modal smoke pair $pair failed operationally as $soft_fail_category; not blocking validation-ref smoke gate because scoring readiness was validated — $readiness"
                  echo "Modal smoke pair $pair failed operationally as $soft_fail_category; not blocking validation-ref smoke gate because scoring readiness was validated — $readiness" >&2
                else
                  echo "::warning::Modal smoke pair $pair failed operationally as $soft_fail_category; not blocking automatic smoke gate — $readiness"
                  echo "Modal smoke pair $pair failed operationally as $soft_fail_category; not blocking automatic smoke gate — $readiness" >&2
                fi
              fi
            done < <(jq -r '.pairs[] | [.pair, .model_slug] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
          fi

          if find "$BENCHMARK_CONTROL/failures" -type f -print -quit 2> /dev/null | grep -q .; then
            echo "Control-plane failures were recorded:" >&2
            find "$BENCHMARK_CONTROL/failures" -type f -print >&2
            matrix_failed=true
          fi
          echo "incomplete=$matrix_incomplete" >> "$GITHUB_OUTPUT"
          if [ "$matrix_failed" = true ]; then
            exit 1
          fi

  cleanup_incomplete_run:
    needs:
      - launch
      - monitor_full
      - collect
    if: >-
      !cancelled() &&
      (needs.launch.result == 'failure' ||
       needs.monitor_full.result == 'failure' ||
       needs.collect.result == 'failure' ||
       needs.collect.outputs.incomplete == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Discover the exact pre-compute benchmark plan
        id: incomplete_plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_NAME: modal-benchmark-plan-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          artifact_index="$RUNNER_TEMP/incomplete-modal-artifacts.json"
          job_index="$RUNNER_TEMP/incomplete-modal-jobs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$artifact_index"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$job_index"
          plan_count="$(jq --arg name "$PLAN_ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name)] | length' \
            "$artifact_index")"
          if [ "$plan_count" -eq 0 ]; then
            total_job_count="$(jq '.jobs | length' "$job_index")"
            launch_job_count="$(jq '[.jobs[] | select(.name == "launch")] | length' "$job_index")"
            if [ "$launch_job_count" -gt 1 ]; then
              echo "Expected at most one launch job, found $launch_job_count" >&2
              exit 1
            fi
            if [ "$launch_job_count" -eq 0 ]; then
              if [ "$total_job_count" -ne 0 ]; then
                echo "The source attempt has jobs but no canonical launch-job evidence." >&2
                exit 1
              fi
            else
              launch_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]?] | length' "$job_index")"
              if [ "$launch_step_count" -eq 0 ]; then
                if ! jq -e '.jobs[] | select(.name == "launch" and .conclusion == "cancelled")' \
                  "$job_index" > /dev/null; then
                  echo "The launch job has no auditable step evidence." >&2
                  exit 1
                fi
              else
                plan_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Persist immutable benchmark plan before starting Modal compute")] | length' "$job_index")"
                build_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Build an immutable Modal image for the candidate")] | length' "$job_index")"
                launch_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Launch detached Modal benchmark sandboxes")] | length' "$job_index")"
                if [ "$plan_step_count" -ne 1 ] || [ "$build_step_count" -ne 1 ] || [ "$launch_step_count" -ne 1 ]; then
                  echo "The launch job is missing canonical pre-compute step evidence." >&2
                  exit 1
                fi
                plan_upload_succeeded="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Persist immutable benchmark plan before starting Modal compute" and .conclusion == "success")] | length' "$job_index")"
                compute_may_have_started="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select((.name == "Build an immutable Modal image for the candidate" or .name == "Launch detached Modal benchmark sandboxes") and .conclusion != "skipped")] | length' "$job_index")"
                if [ "$plan_upload_succeeded" -ne 0 ] || [ "$compute_may_have_started" -ne 0 ]; then
                  echo "The immutable plan is missing even though Modal compute may have started." >&2
                  exit 1
                fi
              fi
            fi
            echo "No immutable plan exists and the exact attempt never reached a Modal compute step."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$plan_count" -eq 1 ]; then
            if ! jq -e --arg name "$PLAN_ARTIFACT_NAME" \
              '.artifacts[] | select(.name == $name and .expired == false)' \
              "$artifact_index" > /dev/null; then
              echo "The exact immutable plan exists but is no longer downloadable." >&2
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Expected at most one exact immutable plan, found $plan_count" >&2
            exit 1
          fi

      - name: Check out the exact incomplete benchmark candidate
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build the incomplete candidate
        if: steps.incomplete_plan.outputs.available == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore the immutable pre-compute benchmark plan
        id: restore_incomplete_plan
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-plan-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore any persisted launch IDs
        id: restore_incomplete_launch
        if: steps.incomplete_plan.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incomplete-modal-benchmark-launch
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Restore any persisted full monitor handoff
        id: restore_incomplete_handoff
        if: steps.incomplete_plan.outputs.available == 'true' && env.BENCHMARK_MODE == 'full'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-handoff-${{ env.BENCHMARK_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/incomplete-modal-benchmark-handoff
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Validate incomplete-run cleanup paths
        id: validate_incomplete_plan
        if: steps.incomplete_plan.outputs.available == 'true'
        env:
          BENCHMARK_PLAN: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          CLEANUP_PAIR_LIST: ${{ runner.temp }}/incomplete-modal-pairs.tsv
          EXPECTED_CANDIDATE: ${{ env.BENCHMARK_CANDIDATE }}
          EXPECTED_GENERATION: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_MODE: ${{ env.BENCHMARK_MODE }}
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          node scripts/ci/prepare-modal-benchmark-cleanup.mjs \
            "$BENCHMARK_PLAN/manifest.json" \
            "$CLEANUP_PAIR_LIST" \
            "$EXPECTED_CANDIDATE" \
            "$EXPECTED_REPOSITORY" \
            "$EXPECTED_GENERATION" \
            "$EXPECTED_MODE" \
            .

      - name: Terminate every exact incomplete-run sandbox
        if: always() && steps.validate_incomplete_plan.outcome == 'success'
        env:
          BENCHMARK_PLAN: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          BENCHMARK_STATE: ${{ steps.restore_incomplete_handoff.outcome == 'success' && format('{0}/incomplete-modal-benchmark-handoff', runner.temp) || format('{0}/incomplete-modal-benchmark-launch', runner.temp) }}
          CLEANUP_PAIR_LIST: ${{ runner.temp }}/incomplete-modal-pairs.tsv
          BUILD_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
          STATE_AVAILABLE: ${{ (steps.restore_incomplete_handoff.outcome == 'success' || steps.restore_incomplete_launch.outcome == 'success') && 'true' || 'false' }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          bash scripts/ci/terminate-modal-benchmark.sh \
            "$BENCHMARK_PLAN" \
            "$BENCHMARK_STATE" \
            "$CLEANUP_PAIR_LIST" \
            "$BUILD_SCOPE" \
            "$STATE_AVAILABLE" \
            "$GITHUB_WORKSPACE"

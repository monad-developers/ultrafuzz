name: Modal Eval Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      experiment:
        description: Strategy topology used for a manual benchmark
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - without-kadenzipfel
          - paired-kadenzipfel

permissions:
  actions: read
  contents: read

concurrency:
  group: modal-eval-${{ github.sha }}
  cancel-in-progress: false

jobs:
  launch:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control
      BENCHMARK_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment || 'candidate' }}

    steps:
      - name: Check out the exact main candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Validate benchmark credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          for name in MODAL_TOKEN_ID MODAL_TOKEN_SECRET OPENAI_API_KEY ANTHROPIC_API_KEY BRAINTRUST_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required benchmark secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Prepare the exact model by benchmark matrix
        run: |
          candidate="$(git rev-parse HEAD)"
          generation="${{ github.run_id }}-${{ github.run_attempt }}"
          node scripts/ci/prepare-modal-benchmarks.mjs \
            "$candidate" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "$generation" \
            "$BENCHMARK_CONTROL" \
            "smoke" \
            "$BENCHMARK_EXPERIMENT"

      - name: Build an immutable Modal image for the candidate
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          image_name="$(jq -r '.image_name' "$BENCHMARK_CONTROL/manifest.json")"
          node packages/modal/dist/cli.js build --image "$image_name" --repo-root .

      - name: Launch detached Modal benchmark sandboxes
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          : > "$BENCHMARK_CONTROL/launch-attempts.jsonl"
          while IFS=$'\t' read -r config state pair; do
            launch_outcome=succeeded
            if ! timeout --signal=TERM --kill-after=30s 20m \
              node packages/modal/dist/cli.js launch \
              --config "$BENCHMARK_CONTROL/$config" \
              --state "$BENCHMARK_CONTROL/$state" \
              --mode fresh \
              --repo-root .; then
              launch_outcome=failed
              echo "Initial detached launch failed for $pair; continuing with the remaining pairs" >&2
            fi
            jq -cn \
              --arg pair "$pair" \
              --arg state "$state" \
              --arg outcome "$launch_outcome" \
              '{pair: $pair, state_path: $state, outcome: $outcome}' \
              >> "$BENCHMARK_CONTROL/launch-attempts.jsonl"
          done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")

      - name: Persist detached launch state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-launch-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  collect:
    needs: launch
    if: >-
      always() &&
      needs.launch.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control
      BENCHMARK_RESULTS: ${{ github.workspace }}/ci-modal/benchmark-results
      BENCHMARK_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment || 'candidate' }}

    steps:
      - name: Check out the benchmark candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore detached launch state
        id: restore_launch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control

      - name: Discover recoverable launch control
        id: launch_control
        if: always()
        run: |
          mkdir -p "$BENCHMARK_CONTROL/diagnostics" "$BENCHMARK_CONTROL/failures" "$BENCHMARK_CONTROL/outcomes" "$BENCHMARK_RESULTS"
          if [ -f "$BENCHMARK_CONTROL/manifest.json" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg category "launch-control-unavailable" \
              '{terminal_status: "failed", category: $category}' \
              > "$BENCHMARK_CONTROL/failures/launch-control-unavailable.json"
          fi

      - name: Wait for Modal compute and retry only pre-model launch failures
        if: steps.launch_control.outputs.available == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          deadline=$((SECONDS + 7200))
          while true; do
            all_terminal=true
            while IFS=$'\t' read -r config state pair; do
              outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
              if [ -f "$outcome_file" ]; then
                continue
              fi

              initial_outcome=unknown
              if [ -f "$BENCHMARK_CONTROL/launch-attempts.jsonl" ]; then
                initial_outcome="$(jq -r --arg pair "$pair" 'select(.pair == $pair) | .outcome' \
                  "$BENCHMARK_CONTROL/launch-attempts.jsonl" | tail -n 1)"
              fi
              recovery_mode=
              if [ ! -f "$BENCHMARK_CONTROL/$state" ]; then
                recovery_mode=fresh
              elif jq -e '.launches | type == "array" and length == 0' \
                "$BENCHMARK_CONTROL/$state" > /dev/null 2>&1; then
                recovery_mode=resume
              fi
              recovery_category=
              if [ "$initial_outcome" = failed ] && [ -n "$recovery_mode" ]; then
                recovery_exit=0
                if [ ! -f "$BENCHMARK_CONTROL/$config" ]; then
                  recovery_exit=66
                else
                  timeout --signal=TERM --kill-after=30s 5m \
                    node packages/modal/dist/cli.js launch \
                    --config "$BENCHMARK_CONTROL/$config" \
                    --state "$BENCHMARK_CONTROL/$state" \
                    --mode "$recovery_mode" \
                    --repo-root . || recovery_exit=$?
                fi
                recovery_category=initial-launch-recovery-failed
                if [ "$recovery_exit" -eq 0 ]; then
                  recovery_category=initial-launch-recovery-succeeded
                elif [ "$recovery_exit" -eq 124 ] || [ "$recovery_exit" -eq 137 ]; then
                  recovery_category=initial-launch-recovery-timeout
                fi
                if { [ "$recovery_exit" -eq 0 ] || [ "$recovery_exit" -eq 124 ] || [ "$recovery_exit" -eq 137 ]; } && \
                  jq -e '.launches | any(.phase == "reserved" or .phase == "sandbox-created" or .phase == "launched")' \
                    "$BENCHMARK_CONTROL/$state" > /dev/null 2>&1; then
                  deadline=$((SECONDS + 7200))
                fi
                jq -n \
                  --arg pair "$pair" \
                  --arg mode "$recovery_mode" \
                  --arg category "$recovery_category" \
                  --argjson exit_code "$recovery_exit" \
                  '{pair: $pair, mode: $mode, category: $category, exit_code: $exit_code}' \
                  > "$BENCHMARK_CONTROL/diagnostics/$pair.initial-launch-recovery.json"
              fi
              if [ ! -f "$BENCHMARK_CONTROL/$state" ]; then
                category=launch-state-missing
                if [ "$recovery_category" = initial-launch-recovery-succeeded ]; then
                  category=initial-launch-recovery-incomplete
                elif [ -n "$recovery_category" ]; then
                  category="$recovery_category"
                fi
                jq -n \
                  --arg pair "$pair" \
                  --arg category "$category" \
                  '{pair: $pair, terminal_status: "failed", category: $category}' \
                  > "$outcome_file"
                continue
              fi
              if jq -e '.launches | type == "array" and length == 0' \
                "$BENCHMARK_CONTROL/$state" > /dev/null 2>&1; then
                category=launch-state-empty
                if [ "$recovery_category" = initial-launch-recovery-succeeded ]; then
                  category=initial-launch-recovery-incomplete
                elif [ -n "$recovery_category" ]; then
                  category="$recovery_category"
                fi
                jq -n \
                  --arg pair "$pair" \
                  --arg category "$category" \
                  '{pair: $pair, terminal_status: "failed", category: $category}' \
                  > "$outcome_file"
                continue
              fi

              status_file="$BENCHMARK_CONTROL/$pair.status.json"
              status_exit=0
              timeout --signal=TERM --kill-after=30s 2m \
                node packages/modal/dist/cli.js status \
                --state "$BENCHMARK_CONTROL/$state" \
                > "$status_file.tmp" || status_exit=$?
              if [ "$status_exit" -ne 0 ]; then
                rm -f "$status_file.tmp"
                all_terminal=false
                status_category=status-query-failed
                if [ "$status_exit" -eq 124 ] || [ "$status_exit" -eq 137 ]; then
                  status_category=status-query-timeout
                fi
                jq -n \
                  --arg pair "$pair" \
                  --arg category "$status_category" \
                  '{pair: $pair, category: $category}' \
                  > "$BENCHMARK_CONTROL/diagnostics/$pair.$status_category.json"
                continue
              fi
              mv "$status_file.tmp" "$status_file"
              if ! category="$(jq -er '.[0].runner_status.category' "$status_file")"; then
                jq -n \
                  --arg pair "$pair" \
                  --arg category "runner-status-invalid" \
                  '{pair: $pair, terminal_status: "failed", category: $category}' \
                  > "$outcome_file"
                continue
              fi
              case "$category" in
                succeeded)
                  jq -n \
                    --arg pair "$pair" \
                    --arg category "$category" \
                    '{pair: $pair, terminal_status: "succeeded", category: $category}' \
                    > "$outcome_file"
                  ;;
                live)
                  all_terminal=false
                  ;;
                transient-operational-failure)
                  all_terminal=false
                  if [ ! -f "$BENCHMARK_CONTROL/$config" ]; then
                    jq -n \
                      --arg pair "$pair" \
                      --arg category "launch-config-missing" \
                      '{pair: $pair, terminal_status: "failed", category: $category}' \
                      > "$outcome_file"
                  else
                    resume_exit=0
                    timeout --signal=TERM --kill-after=30s 5m \
                    node packages/modal/dist/cli.js launch \
                    --config "$BENCHMARK_CONTROL/$config" \
                    --state "$BENCHMARK_CONTROL/$state" \
                    --mode resume \
                    --repo-root . || resume_exit=$?
                    if [ "$resume_exit" -eq 0 ]; then
                      deadline=$((SECONDS + 7200))
                    else
                      resume_category=resume-attempt-failed
                      if [ "$resume_exit" -eq 124 ] || [ "$resume_exit" -eq 137 ]; then
                        resume_category=resume-attempt-timeout
                      fi
                      jq -n \
                        --arg pair "$pair" \
                        --arg category "$resume_category" \
                        --argjson exit_code "$resume_exit" \
                        '{pair: $pair, category: $category, exit_code: $exit_code}' \
                        > "$BENCHMARK_CONTROL/diagnostics/$pair.$resume_category.json"
                    fi
                    if { [ "$resume_exit" -eq 124 ] || [ "$resume_exit" -eq 137 ]; } && \
                      jq -e '.launches | any(.phase == "reserved" or .phase == "sandbox-created" or .phase == "launched")' \
                        "$BENCHMARK_CONTROL/$state" > /dev/null 2>&1; then
                      deadline=$((SECONDS + 7200))
                    fi
                  fi
                  ;;
                *)
                  echo "Modal pair $pair ended as $category" >&2
                  jq -n \
                    --arg pair "$pair" \
                    --arg category "$category" \
                    '{pair: $pair, terminal_status: "failed", category: $category}' \
                    > "$outcome_file"
                  ;;
              esac
            done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
            if [ "$all_terminal" = true ]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "Modal benchmark matrix exceeded the two-hour control-plane deadline" >&2
              while IFS=$'\t' read -r pair; do
                outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
                if [ ! -f "$outcome_file" ]; then
                  jq -n \
                    --arg pair "$pair" \
                    --arg category "control-plane-timeout" \
                    '{pair: $pair, terminal_status: "failed", category: $category}' \
                    > "$outcome_file"
                fi
              done < <(jq -r '.pairs[] | [.pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
              break
            fi
            sleep 60
          done

      - name: Collect and validate public finding bundles
        if: steps.launch_control.outputs.available == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          mkdir -p "$BENCHMARK_RESULTS"
          while IFS=$'\t' read -r config state pair; do
            outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
            if [ ! -f "$outcome_file" ] || ! jq -e '.terminal_status == "succeeded"' "$outcome_file" > /dev/null; then
              continue
            fi
            collection_exit=0
            timeout --signal=TERM --kill-after=30s 5m \
              node packages/modal/dist/cli.js collect \
              --config "$BENCHMARK_CONTROL/$config" \
              --state "$BENCHMARK_CONTROL/$state" \
              --output "$BENCHMARK_RESULTS/$pair" \
              --public-results || collection_exit=$?
            if [ "$collection_exit" -eq 0 ]; then
              jq '.collection_status = "succeeded"' "$outcome_file" > "$outcome_file.tmp"
              mv "$outcome_file.tmp" "$outcome_file"
            else
              rm -rf "${BENCHMARK_RESULTS:?}/$pair"
              collection_category=collection-failed
              if [ "$collection_exit" -eq 124 ] || [ "$collection_exit" -eq 137 ]; then
                collection_category=collection-timeout
              fi
              jq \
                --arg category "$collection_category" \
                '.terminal_status = "failed" | .collection_status = "failed" | .category = $category' \
                "$outcome_file" > "$outcome_file.tmp"
              mv "$outcome_file.tmp" "$outcome_file"
            fi
          done < <(jq -r '.pairs[] | [.config_path, .state_path, .pair] | @tsv' "$BENCHMARK_CONTROL/manifest.json")

      - name: Build the paired Kaden strategy comparison
        if: steps.launch_control.outputs.available == 'true' && env.BENCHMARK_EXPERIMENT == 'paired-kadenzipfel'
        run: |
          if ! node scripts/ci/compare-kadenzipfel-ablation.mjs \
            "$BENCHMARK_CONTROL/manifest.json" \
            "$BENCHMARK_RESULTS" \
            "$BENCHMARK_RESULTS/comparison"; then
            jq -n \
              --arg category "ablation-comparison-failed" \
              '{terminal_status: "failed", category: $category}' \
              > "$BENCHMARK_CONTROL/failures/ablation-comparison-failed.json"
          fi

      - name: Upload public benchmark reports and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark-results-${{ env.BENCHMARK_EXPERIMENT }}-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-modal/benchmark-results
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload launch state and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modal-benchmark-control-${{ env.BENCHMARK_EXPERIMENT }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/ci-modal/benchmark-control
            ${{ github.workspace }}/ci-modal/benchmark-results
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Fail an incomplete matrix after preserving artifacts
        if: always()
        run: |
          matrix_failed=false
          if [ ! -f "$BENCHMARK_CONTROL/manifest.json" ]; then
            echo "Detached launch control was unavailable" >&2
            matrix_failed=true
          else
            expected_attempts="$(jq '.pairs | length' "$BENCHMARK_CONTROL/manifest.json")"
            actual_attempts=0
            if [ -f "$BENCHMARK_CONTROL/launch-attempts.jsonl" ]; then
              actual_attempts="$(jq -s 'length' "$BENCHMARK_CONTROL/launch-attempts.jsonl")"
            fi
            if [ "$actual_attempts" -ne "$expected_attempts" ]; then
              echo "Attempted $actual_attempts of $expected_attempts detached pair launches" >&2
              matrix_failed=true
            fi

            while IFS=$'\t' read -r pair slug; do
              outcome_file="$BENCHMARK_CONTROL/outcomes/$pair.json"
              bundle="$BENCHMARK_RESULTS/$pair/$slug/public-results.json"
              if [ ! -f "$outcome_file" ] || \
                ! jq -e '.terminal_status == "succeeded" and .collection_status == "succeeded"' \
                  "$outcome_file" > /dev/null; then
                echo "Modal pair $pair did not finish and collect successfully" >&2
                matrix_failed=true
              elif [ ! -f "$bundle" ]; then
                echo "Modal pair $pair is missing its validated public result bundle" >&2
                matrix_failed=true
              fi
            done < <(jq -r '.pairs[] | [.pair, .model_slug] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
          fi

          if find "$BENCHMARK_CONTROL/failures" -type f -print -quit 2> /dev/null | grep -q .; then
            echo "Control-plane failures were recorded:" >&2
            find "$BENCHMARK_CONTROL/failures" -type f -print >&2
            matrix_failed=true
          fi
          if [ "$matrix_failed" = true ]; then
            exit 1
          fi

  publish:
    needs: collect
    if: >-
      needs.collect.result == 'success' &&
      (github.event_name == 'push' ||
      (github.ref == 'refs/heads/main' && inputs.experiment == 'candidate'))
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BENCHMARK_CONTROL: ${{ github.workspace }}/ci-modal/benchmark-control
      BENCHMARK_RESULTS: ${{ github.workspace }}/ci-modal/benchmark-results

    steps:
      - name: Check out current main publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install and build the candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore benchmark control metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modal-benchmark-launch-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-modal/benchmark-control

      - name: Restore public benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: public-benchmark-results-candidate-${{ github.run_id }}
          path: ${{ github.workspace }}/ci-modal/benchmark-results

      - name: Publish the atomic four-pair generation with compare-and-swap retries
        env:
          PUBLICATION_GENERATION: ${{ runner.temp }}/eval-history-generation.json
          PUBLICATION_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          artifact="$PUBLICATION_REPOSITORY/actions/runs/${{ github.run_id }}"
          jq -n \
            --arg repository "$PUBLICATION_REPOSITORY" \
            --arg artifact "$artifact" \
            '{
              schema_version: "ultrafuzz.eval-history-publication-generation.v1",
              candidate_repository_url: $repository,
              source_artifact: $artifact,
              runs: []
            }' > "$PUBLICATION_GENERATION"
          while IFS=$'\t' read -r pair benchmark lane slug; do
            bundle="$BENCHMARK_RESULTS/$pair/$slug/public-results.json"
            unpacked="$BENCHMARK_RESULTS/unpacked/$pair"
            metadata="$(node packages/modal/dist/cli.js unpack-public --bundle "$bundle" --output "$unpacked")"
            eval_run_id="$(jq -er '.eval_run_id' <<< "$metadata")"
            jq \
              --arg eval_run_id "$eval_run_id" \
              --arg benchmark "$benchmark" \
              --arg lane "$lane" \
              --arg input_path "$pair/eval" \
              '.runs += [{
                eval_run_id: $eval_run_id,
                benchmark: $benchmark,
                lane: $lane,
                input_path: $input_path
              }]' \
              "$PUBLICATION_GENERATION" > "$PUBLICATION_GENERATION.tmp"
            mv "$PUBLICATION_GENERATION.tmp" "$PUBLICATION_GENERATION"
          done < <(jq -r '.pairs[] | [.pair, .benchmark, .lane, .model_slug] | @tsv' "$BENCHMARK_CONTROL/manifest.json")
          test "$(jq '.runs | length' "$PUBLICATION_GENERATION")" -eq 4
          node scripts/ci/publish-eval-history-cas.mjs \
            "$PUBLICATION_GENERATION" \
            "$BENCHMARK_RESULTS/unpacked"

      - name: Open the publication pull request when needed
        env:
          GH_TOKEN: ${{ secrets.EVAL_HISTORY_PR_TOKEN || github.token }}
        run: |
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...automation%2Feval-history?expand=1"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git ls-remote --exit-code --heads origin refs/heads/automation/eval-history > /dev/null; then
            echo "No pending eval-history publication branch is needed"
            exit 0
          fi
          git fetch --no-tags origin \
            "+refs/heads/automation/eval-history:refs/remotes/origin/automation/eval-history"
          open_prs="$(gh pr list \
            --state open \
            --base main \
            --head automation/eval-history \
            --json number \
            --jq 'length')"
          if git diff --quiet \
            origin/main \
            origin/automation/eval-history \
            -- \
            benchmarks/history.json \
            docs/assets/eval-history; then
            pending_publication=false
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              echo "Unable to compare the eval-history publication trees" >&2
              exit "$diff_status"
            fi
            pending_publication=true
          fi
          if [ "$open_prs" -eq 0 ] && [ "$pending_publication" = true ]; then
            if gh pr create \
              --base main \
              --head automation/eval-history \
              --title "[ci skip] Update published eval history" \
              --body $'## Summary\n\nAppend atomic Modal generations for GPT-5.6 Luna and Claude Sonnet 5 across EVMBench and Ultrafuzz-bench, scored by GPT-5.6 Sol xhigh.\n\n## Verification\n\n- Published only after every model × benchmark pair succeeded\n- Uploaded public reports and finding bundles as Actions artifacts\n- Retried remote-tip races without dropping generations\n- Regenerated and checked deterministic README charts'; then
              exit 0
            fi
            open_prs="$(gh pr list \
              --state open \
              --base main \
              --head automation/eval-history \
              --json number \
              --jq 'length')"
            if [ "$open_prs" -eq 0 ]; then
              echo "::warning title=Eval-history PR not opened::Automatic pull-request creation is unavailable. The publication branch remains pushed; use the job summary link."
              {
                echo "### Eval-history publication is waiting for a pull request"
                echo
                echo "The complete generation remains preserved on \`automation/eval-history\`."
                echo
                echo "[Compare and open the publication pull request]($compare_url)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Another publisher opened the eval-history pull request"
          fi

name: Check
on:
  pull_request:
  push:
    branches: [release/v0.2.0]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The tests import the source. This step runs the built command line, which every README command uses. It stays offline.
      - run: bun dist/cli.js --version && bun dist/cli.js --home "$RUNNER_TEMP/uf" init && bun dist/cli.js --home "$RUNNER_TEMP/uf" profiles
  # The Docker executor against a real Docker Engine. No model is called and no secret is used.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: docker version
      - run: bun run test:docker

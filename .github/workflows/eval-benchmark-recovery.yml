name: Recover Incomplete Modal Benchmarks
run-name: >-
  Recover Modal benchmark candidate ${{ github.event.workflow_run.head_sha }}
  from source run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows:
      - Modal Eval Benchmarks
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: modal-eval-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  cleanup_incomplete_run:
    name: >-
      Recover candidate ${{ github.event.workflow_run.head_sha }}
      from source run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.path == '.github/workflows/eval-benchmarks.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      BENCHMARK_CANDIDATE: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Publish candidate attribution
        run: |
          {
            echo "## Modal benchmark recovery attribution"
            echo
            echo "- Candidate tree: [$BENCHMARK_CANDIDATE]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$BENCHMARK_CANDIDATE)"
            echo "- Source benchmark: [run $SOURCE_RUN_ID, attempt $SOURCE_RUN_ATTEMPT]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT)"
            echo "- Trusted recovery tooling: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo
            echo "GitHub attaches workflow_run checks to the trusted default-branch tooling commit."
            echo "This recovery result operates on the candidate tree named above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discover the exact pre-compute benchmark plan
        id: incomplete_plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_index="$RUNNER_TEMP/incomplete-modal-artifacts.json"
          job_index="$RUNNER_TEMP/incomplete-modal-jobs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$artifact_index"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" \
            > "$job_index"
          plan_count=0
          plan_mode=
          plan_artifact_name=
          for mode in smoke full threat-model; do
            candidate_name="modal-benchmark-plan-$mode-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
            candidate_count="$(jq --arg name "$candidate_name" \
              '[.artifacts[] | select(.name == $name)] | length' \
              "$artifact_index")"
            if [ "$candidate_count" -gt 0 ]; then
              plan_count=$((plan_count + candidate_count))
              plan_mode="$mode"
              plan_artifact_name="$candidate_name"
            fi
          done
          if [ "$plan_count" -eq 0 ]; then
            total_job_count="$(jq '.jobs | length' "$job_index")"
            launch_job_count="$(jq '[.jobs[] | select(.name == "launch")] | length' "$job_index")"
            if [ "$launch_job_count" -gt 1 ]; then
              echo "Expected at most one launch job, found $launch_job_count" >&2
              exit 1
            fi
            if [ "$launch_job_count" -eq 0 ]; then
              if [ "$total_job_count" -ne 0 ]; then
                echo "The source attempt has jobs but no canonical launch-job evidence." >&2
                exit 1
              fi
            else
              launch_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]?] | length' "$job_index")"
              if [ "$launch_step_count" -eq 0 ]; then
                if ! jq -e '.jobs[] | select(.name == "launch" and .conclusion == "cancelled")' \
                  "$job_index" > /dev/null; then
                  echo "The launch job has no auditable step evidence." >&2
                  exit 1
                fi
              else
                plan_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Persist immutable benchmark plan before starting Modal compute")] | length' "$job_index")"
                build_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Build an immutable Modal image for the candidate")] | length' "$job_index")"
                launch_step_count="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Launch detached Modal benchmark sandboxes")] | length' "$job_index")"
                if [ "$plan_step_count" -ne 1 ] || [ "$build_step_count" -ne 1 ] || [ "$launch_step_count" -ne 1 ]; then
                  echo "The launch job is missing canonical pre-compute step evidence." >&2
                  exit 1
                fi
                plan_upload_succeeded="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select(.name == "Persist immutable benchmark plan before starting Modal compute" and .conclusion == "success")] | length' "$job_index")"
                compute_may_have_started="$(jq '[.jobs[] | select(.name == "launch") | .steps[]? | select((.name == "Build an immutable Modal image for the candidate" or .name == "Launch detached Modal benchmark sandboxes") and .conclusion != "skipped")] | length' "$job_index")"
                if [ "$plan_upload_succeeded" -ne 0 ] || [ "$compute_may_have_started" -ne 0 ]; then
                  echo "The immutable plan is missing even though Modal compute may have started." >&2
                  exit 1
                fi
              fi
            fi
            echo "No immutable plan exists and the exact attempt never reached a Modal compute step."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$plan_count" -eq 1 ]; then
            if ! jq -e --arg name "$plan_artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false)' \
              "$artifact_index" > /dev/null; then
              echo "The exact immutable plan exists but is no longer downloadable." >&2
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "benchmark_mode=$plan_mode" >> "$GITHUB_OUTPUT"
            echo "plan_artifact_name=$plan_artifact_name" >> "$GITHUB_OUTPUT"
          else
            echo "Expected at most one exact immutable plan, found $plan_count" >&2
            exit 1
          fi

      - name: Check out trusted default-branch cleanup tooling
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the incomplete candidate as data only
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCHMARK_CANDIDATE }}
          path: candidate-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Set up Node.js
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install and build only trusted cleanup tooling
        if: steps.incomplete_plan.outputs.available == 'true'
        working-directory: ${{ github.workspace }}/trusted-tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm -w build

      - name: Restore the incomplete run's immutable pre-compute plan
        if: steps.incomplete_plan.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.incomplete_plan.outputs.plan_artifact_name }}
          path: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate incomplete-run identity and termination scopes
        id: validate_incomplete_plan
        if: steps.incomplete_plan.outputs.available == 'true'
        working-directory: ${{ github.workspace }}/trusted-tooling
        env:
          BENCHMARK_PLAN: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          CANDIDATE_SOURCE: ${{ github.workspace }}/candidate-source
          CLEANUP_PAIR_LIST: ${{ runner.temp }}/incomplete-modal-pairs.tsv
          EXPECTED_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          BENCHMARK_MODE: ${{ steps.incomplete_plan.outputs.benchmark_mode }}
        run: |
          actual_candidate="$(git -C "$CANDIDATE_SOURCE" rev-parse HEAD)"
          tracked_changes="$(git -C "$CANDIDATE_SOURCE" status --porcelain=v1 --untracked-files=no)"
          if [ "$actual_candidate" != "$BENCHMARK_CANDIDATE" ] || [ -n "$tracked_changes" ]; then
            echo "The data-only candidate checkout does not match the incomplete run." >&2
            exit 1
          fi
          node scripts/ci/prepare-modal-benchmark-cleanup.mjs \
            "$BENCHMARK_PLAN/manifest.json" \
            "$CLEANUP_PAIR_LIST" \
            "$BENCHMARK_CANDIDATE" \
            "$EXPECTED_REPOSITORY" \
            "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            "$BENCHMARK_MODE" \
            "$CANDIDATE_SOURCE"

      - name: Terminate every exact incomplete-run sandbox
        if: always() && steps.validate_incomplete_plan.outcome == 'success'
        working-directory: ${{ github.workspace }}/trusted-tooling
        env:
          BENCHMARK_PLAN: ${{ runner.temp }}/incomplete-modal-benchmark-plan
          CLEANUP_PAIR_LIST: ${{ runner.temp }}/incomplete-modal-pairs.tsv
          CANDIDATE_SOURCE: ${{ github.workspace }}/candidate-source
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          bash scripts/ci/terminate-modal-benchmark.sh \
            "$BENCHMARK_PLAN" \
            "$RUNNER_TEMP/incomplete-modal-no-state" \
            "$CLEANUP_PAIR_LIST" \
            "$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            false \
            "$CANDIDATE_SOURCE"

# Super-Linter's default markdownlint rules (v8.7.0 TEMPLATES/.markdown-lint.yml)
# with MD013 line length off. Super-Linter lints each changed file in full, and
# CHANGELOG.md keeps each entry on one line while docs tables have rows past
# 400 characters, so any edit to those files failed on lines nobody touched.
MD004: false
MD007:
  indent: 2
MD013: false
MD026:
  punctuation: ".,;:!。，；:"
MD029: false
MD033: false
MD036: false
blank_lines: false

schema_version = "ultrafuzz.config.v2"
audit_profile = "default"
dynamic_strategies_enumerator = 3

[project]
repo = "."

[run]
completion_policy = "best-effort"
output_dir = ".ultrafuzz/runs"
max_parallel_agents = 4
max_dynamic_nodes = 2048
keep_workspaces = false
forge_guard_enabled = true
forge_vmem_limit_kb = 12582912
forge_rayon_threads = 1
workspace_mode = "git-worktree"
default_timeout_seconds = 3600
workflow_deadline_seconds = 86400
controller_lease_seconds = 30

[execution]
mode = "local"
retention_days = 30

[execution.resources]
cpu = 4
memory_mib = 8192
timeout_seconds = 3600

[models]
synthesized_default = true

[models.default]
agent = "CodexAgent"
model = "gpt-5.5"
reasoning = "xhigh"

# Opt-in Claude profile. Select it per node/group in .ultrafuzz/topology.yml
# (model_profiles = ["claude"]), or for a one-off run with `--agent ClaudeAgent`.
# ClaudeAgent passes profile `reasoning` to the current Claude Code CLI as --effort.
[models.claude]
agent = "ClaudeAgent"
model = "claude-opus-4-8"

# Opt-in Kimi profile. Select it per node/group in .ultrafuzz/topology.yml
# (model_profiles = ["kimi"]), or for a one-off run with `--agent KimiAgent`.
# `kimi-k3` is a local Kimi Code alias for model k3 at max effort.
[models.kimi]
agent = "KimiAgent"
model = "kimi-k3"
reasoning = "max"

# Opt-in DeepSeek V4 profile. This runs the Claude Code harness against
# DeepSeek's Anthropic-compatible API endpoint: a compatibility pairing, not
# DeepSeek's first-party coding agent.
[models.deepseek]
agent = "DeepSeekAgent"
model = "deepseek-v4-pro"
reasoning = "max"

# Opt-in Pi profile. Select it per node/group in .ultrafuzz/topology.yml
# (model_profiles = ["pi"]), or for a one-off run with `--agent PiAgent`.
# PiAgent always routes through OpenRouter, so `model` is an opaque OpenRouter
# catalogue id resolved by the pi CLI itself.
# `reasoning` is optional here. The levels supported today are off, minimal,
# low, medium, high, xhigh, and max. Ultrafuzz forwards the selected level to
# pi's --thinking flag without degrading it.
[models.pi]
agent = "PiAgent"
model = "openai/gpt-mini-latest"

# Automatic retries resend the same effective task in a fresh session. The
# count includes the first primary attempt; `agents` optionally selects an
# ordered model-profile fallback chain.
[retry]
same_agent_attempts = 3
agents = []

[agents.CodexAgent]
auth = "api-key"
api_key_env = "OPENAI_API_KEY"

[agents.ClaudeAgent]
# "subscription" uses your logged-in Claude Code CLI (`claude -p`); no API key needed,
# and ANTHROPIC_API_KEY is cleared so the subscription wins. Switch to "api-key" to
# bill against the Anthropic API instead (reads canonical ANTHROPIC_API_KEY).
#
# Per permissions.trust_model below, this agent runs with Claude Code's permission
# checks bypassed, so tasks get unattended filesystem and shell access inside their
# worktree. That is set in .smithers/agents/claude.ts, not here.
auth = "subscription"

[agents.KimiAgent]
# "subscription" uses your logged-in Kimi Code CLI from KIMI_CODE_HOME or
# ~/.kimi-code. Switch to "api-key" to bill against a Kimi/Moonshot-compatible
# API key instead; KIMI_API_KEY is canonical and MOONSHOT_API_KEY remains a fallback.
auth = "subscription"

[agents.DeepSeekAgent]
# DeepSeek V4 is API-key only. The generated adapter reads DEEPSEEK_API_KEY and
# routes the Claude Code harness to DeepSeek's Anthropic-compatible endpoint.
auth = "api-key"
api_key_env = "DEEPSEEK_API_KEY"

[agents.OpenCodeAgent]
# The generated adapter runs the OpenCode CLI with `--pure` and points the
# OpenCode state roots it names -- the XDG base directories, OPENCODE_CONFIG_DIR
# and OPENCODE_DB, plus the npm and bun caches -- at a run-scoped directory, so
# none of those roots resolves to a shared per-user location such as ~/.local/share
# or ~/.npm. The roots are project-local, so they sit under the project directory
# itself. That is the list the adapter names, not a guarantee that OpenCode has no
# other state root; docs/config.md has the full list and the same caveat.
# "api-key" reads OPENROUTER_API_KEY unless api_key_env names another variable,
# and places it in the child environment only, never on the command line.
# "subscription" is rejected: OpenCode reads auth.json from $XDG_DATA_HOME, which
# the adapter always relocates into the run, so a login held in your home is
# unreachable and the agent would run unauthenticated. config_dir relocates the
# state root; it is the XDG parent, so pointing it at ~/.config/opencode or
# ~/.local/share/opencode picks nothing up.
auth = "api-key"
api_key_env = "OPENROUTER_API_KEY"

[agents.OpenRouterAgent]
# OpenRouter is API-key only. The generated Codex adapter routes through the
# configured OpenRouter endpoint without exposing credentials on argv.
auth = "api-key"
api_key_env = "OPENROUTER_API_KEY"

[agents.PiAgent]
# The pi CLI is API-key only here: the generated adapter fixes the provider to
# OpenRouter and reads OPENROUTER_API_KEY (unless api_key_env names another
# variable), handing it to pi through the child environment so no credential
# value ever reaches argv.
auth = "api-key"
api_key_env = "OPENROUTER_API_KEY"

[permissions]
trust_model = "skip-permissions"
prompt_review_required = true
materialize_outputs_as_unstaged = true
# Target-relative roots whose committed contents are production source. Workspace
# handoffs fail closed if an agent edits, deletes, or adds a file under these roots.
production_source_roots = ["src", "contracts"]


[invariants]
property_priority_threshold = "high"
reference_expectation_selection = "priority"
invariant_testing_smoke_timeout = "10min"
invariant_testing_fuzzer_timeout = "1h"

[triage]
quorum = 3
panel_size = 4

[eval]
eval_config = ".ultrafuzz/evals/bug-finding.yml"
# ground_truth_root is machine-specific and MUST resolve outside the repo, e.g.:
# ground_truth_root = "/secure/eval-ground-truth"
provider = "none"

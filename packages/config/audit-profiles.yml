schema_version: 2

profiles:
  smoke:
    description: Fast end-to-end workflow validation, not a comprehensive audit.
    intended_use: CI, installation, and integration checks.
    topology_path: topologies/smoke.yml
    settings:
      strategy_loops: 1
      dynamic_strategies_enumerator: 0
      max_parallel_agents: 4
      max_parallel_nodes: 4
      workflow_deadline_seconds: 14400

  low-cost:
    description: Cost-sensitive real audit with reduced breadth and depth.
    intended_use: Budget-constrained audits that still require the normal project workflow.
    settings:
      strategy_loops: 1
      dynamic_strategies_enumerator: 1
      max_parallel_agents: 2
      max_parallel_nodes: 4
      workflow_deadline_seconds: 43200
      triage_quorum: 2
      triage_panel_size: 3

  default:
    description: Applies no settings overrides and uses the editable project topology.
    intended_use: General-purpose audits using the editable project topology.
    settings: {}

  full:
    description: Complete audit with direct discovery plus deep differential, stateful, and dynamic specialist lanes.
    intended_use: Specialist audits that explicitly opt into the complete shipped workflow.
    topology_path: topologies/full.yml
    settings: {}

  thorough:
    description: Broader and deeper passes over the configured project workflow at higher cost.
    intended_use: High-assurance repeated passes, with additional dynamic goals when supported by the configured topology.
    settings:
      strategy_loops: 3
      dynamic_strategies_enumerator: 5
      max_parallel_agents: 4
      max_parallel_nodes: 8
      workflow_deadline_seconds: 86400

  exhaustive:
    description: Maximum repetition, concurrency, and dynamic enumeration for the configured project workflow.
    intended_use: Highest-cost repetition and resource limits for critical investigations using the configured topology.
    settings:
      strategy_loops: 5
      dynamic_strategies_enumerator: unlimited
      max_parallel_agents: 8
      max_parallel_nodes: 16
      workflow_deadline_seconds: 86400

  invariant-only:
    description: Focused stateful-invariant discovery, implementation, campaign, and reporting.
    intended_use: Focused stateful-invariant campaigns for ScFuzzBench.
    topology_path: topologies/invariant-only.yml
    settings:
      strategy_loops: 3
      dynamic_strategies_enumerator: 0
      max_parallel_agents: 4
      max_parallel_nodes: 8
      workflow_deadline_seconds: 86400
      invariant_testing_smoke_timeout_seconds: 600
      invariant_testing_fuzzer_timeout_seconds: 3600

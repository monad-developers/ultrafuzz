    kind: agentic
    prompt: setup/project-discovery.md
    group: setup
    depends_on:
      - __start__
    required_artifacts:
      - setup/project-discovery.md
    primary_artifact: setup/project-discovery.md
  - id: actors-flows
    kind: agentic
    prompt: setup/actors-flows.md
    group: setup
    depends_on:
      - project-discovery
    required_artifacts:

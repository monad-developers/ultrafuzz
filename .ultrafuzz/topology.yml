version: 2
defaults:
  strategy_loops: 1
groups:
  setup:
    label: Setup
    color: "#2563eb"
  properties:
    label: Properties
    color: "#a16207"
  strategies:
    label: Strategies
    color: "#7c3aed"
    defaults:
      loops: 3
      timeout_seconds: 7200
      model_profiles:
        - default
  references:
    label: References
    color: "#4b5563"
  review:
    label: Review
    color: "#0f766e"
nodes:
  - id: __start__
    kind: meta
    role: start
    depends_on: []
  - id: __finish__
    kind: meta
    role: finish
    depends_on:
      - final-report
  - id: project-discovery
    kind: agentic
    prompt: nofuzz/setup/project-discovery.md
    group: setup
    depends_on:
      - __start__
    outputs:
      - path: setup/project-discovery.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: setup/invariant-evidence-ledger.json
        contract: ultrafuzz/invariant-ledger@1
  - id: actors-flows
    kind: agentic
    prompt: setup/actors-flows.md
    group: setup
    depends_on:
      - project-discovery
    outputs:
      - path: setup/actors-flows.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
  - id: setup-foundry
    kind: agentic
    prompt: nofuzz/setup/prepare-foundry-harness.md
    group: setup
    depends_on:
      - actors-flows
    outputs:
      - path: setup/setup-foundry.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: workspace.patch
        contract: ultrafuzz/text@1
      - path: workspace-patch.json
        contract: ultrafuzz/workspace-patch@1
  - id: base-test-setup
    kind: agentic
    prompt: nofuzz/setup/discover-base-test.md
    group: setup
    depends_on:
      - setup-foundry
    outputs:
      - path: setup/base-test-setup.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: workspace.patch
        contract: ultrafuzz/text@1
      - path: workspace-patch.json
        contract: ultrafuzz/workspace-patch@1
  - id: boundary-tests
    kind: agentic
    prompt: strategies/boundary-tests.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: boundary-recipes.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: boundary-recipes.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
  - id: encode-decode
    kind: agentic
    prompt: strategies/encode-decode.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: differential-library-tests
    kind: agentic
    prompt: strategies/differential-library-tests.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
    loops: 1
  - id: round-trip
    kind: agentic
    prompt: strategies/round-trip.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: workflow-property-based-tests
    kind: agentic
    prompt: strategies/workflow-property-based-tests.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: time-warp-sequences
    kind: agentic
    prompt: strategies/time-warp-sequences.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: admin-config-boundaries
    kind: agentic
    prompt: strategies/admin-config-boundaries.md
    group: strategies
    depends_on:
      - base-test-setup
      - actors-flows
    outputs:
      - path: admin-config-boundary-matrix.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: admin-config-boundary-matrix.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
  - id: external-dependency-boundaries
    kind: agentic
    prompt: strategies/external-dependency-boundaries.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: dependency-scope-matrix.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: dependency-scope-matrix.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
  - id: externalized-state-accounting
    kind: agentic
    prompt: strategies/externalized-state-accounting.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: externalized-state-accounting.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: externalized-state-accounting.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
  - id: amm-boundary-liquidity
    kind: agentic
    prompt: strategies/amm-boundary-liquidity.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: payable-fallback-accounting
    kind: agentic
    prompt: strategies/payable-fallback-accounting.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: packed-action-parity
    kind: agentic
    prompt: strategies/packed-action-parity.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: batch-atomicity-unsupported-actions
    kind: agentic
    prompt: strategies/batch-atomicity-unsupported-actions.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: router-exact-accounting
    kind: agentic
    prompt: strategies/router-exact-accounting.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: rounding-direction-audit
    kind: agentic
    prompt: strategies/rounding-direction-audit.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: market-exhaustion-boundaries
    kind: agentic
    prompt: strategies/market-exhaustion-boundaries.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: order-replacement-collateral
    kind: agentic
    prompt: strategies/order-replacement-collateral.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: state-machine-boundaries
    kind: agentic
    prompt: strategies/state-machine-boundaries.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: lifecycle-view-boundaries
    kind: agentic
    prompt: strategies/lifecycle-view-boundaries.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
  - id: differential-oracle-planner
    kind: agentic
    prompt: strategies/differential/differential-oracle-planner.md
    group: strategies
    depends_on:
      - base-test-setup
    outputs:
      - path: differential-plan.json
        contract: ultrafuzz/json-object@1
        primary: true
    loops: 1
  - id: reference-harness-author
    kind: agentic
    prompt: strategies/differential/reference-harness-author.md
    group: strategies
    depends_on:
      - differential-oracle-planner
    outputs:
      - path: reference-harness.json
        contract: ultrafuzz/json-object@1
        primary: true
    loops: 1
  - id: reference-and-lane-auditor
    kind: agentic
    prompt: strategies/differential/reference-and-lane-auditor.md
    group: strategies
    depends_on:
      - reference-harness-author
    outputs:
      - path: audited-differential-lanes.json
        contract: ultrafuzz/json-object@1
        primary: true
    loops: 1
  - id: differential-lane-author
    kind: agentic
    prompt: strategies/differential/differential-lane-author.md
    group: strategies
    depends_on:
      - reference-and-lane-auditor
    outputs:
      - path: lane-result.json
        contract: ultrafuzz/json-object@1
        primary: true
      - path: findings.json
        contract: ultrafuzz/findings@1
    loops: 1
  - id: differential-red-triage
    kind: agentic
    prompt: strategies/differential/differential-red-triage.md
    group: strategies
    depends_on:
      - differential-lane-author
    outputs:
      - path: semantic-red-registry.json
        contract: ultrafuzz/json-object@1
        primary: true
      - path: triage-a.json
        contract: ultrafuzz/json-object@1
      - path: triage-b.json
        contract: ultrafuzz/json-object@1
    loops: 1
  - id: differential-repair-and-report-review
    kind: agentic
    prompt: strategies/differential/differential-repair-and-report-review.md
    group: strategies
    depends_on:
      - differential-red-triage
    outputs:
      - path: repair-summary.json
        contract: ultrafuzz/json-object@1
        primary: true
      - path: gap-review.json
        contract: ultrafuzz/json-object@1
      - path: differential-report-review.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
    loops: 1
  - id: dynamic-strategy-generator
    kind: agentic
    prompt: strategies/dynamic-strategy-generator.md
    group: strategies
    depends_on:
      - boundary-tests
      - encode-decode
      - differential-library-tests
      - round-trip
      - workflow-property-based-tests
      - time-warp-sequences
      - admin-config-boundaries
      - external-dependency-boundaries
      - externalized-state-accounting
      - amm-boundary-liquidity
      - payable-fallback-accounting
      - packed-action-parity
      - batch-atomicity-unsupported-actions
      - router-exact-accounting
      - rounding-direction-audit
      - market-exhaustion-boundaries
      - order-replacement-collateral
      - state-machine-boundaries
      - lifecycle-view-boundaries
      - differential-oracle-planner
      - reference-harness-author
      - reference-and-lane-auditor
      - differential-lane-author
      - differential-red-triage
      - differential-repair-and-report-review
    outputs:
      - path: strategy-plan.json
        contract: ultrafuzz/json-object@1
        primary: true
      - path: enumerator-outputs.json
        contract: ultrafuzz/json-object@1
      - path: aggregate-recommendations.json
        contract: ultrafuzz/json-object@1
      - path: selected-strategies.json
        contract: ultrafuzz/json-object@1
      - path: findings.json
        contract: ultrafuzz/findings@1
      - path: provenance.json
        contract: ultrafuzz/json-object@1
    loops: 1
  - id: dedupe-findings
    kind: agentic
    prompt: nofuzz/review/dedupe-findings.md
    group: review
    depends_on:
      - boundary-tests
      - encode-decode
      - differential-library-tests
      - round-trip
      - workflow-property-based-tests
      - time-warp-sequences
      - admin-config-boundaries
      - external-dependency-boundaries
      - externalized-state-accounting
      - amm-boundary-liquidity
      - payable-fallback-accounting
      - packed-action-parity
      - batch-atomicity-unsupported-actions
      - router-exact-accounting
      - rounding-direction-audit
      - market-exhaustion-boundaries
      - order-replacement-collateral
      - state-machine-boundaries
      - lifecycle-view-boundaries
      - differential-oracle-planner
      - reference-harness-author
      - reference-and-lane-auditor
      - differential-lane-author
      - differential-red-triage
      - differential-repair-and-report-review
      - dynamic-strategy-generator
    outputs:
      - path: deduped-findings.json
        contract: ultrafuzz/json-array@1
        primary: true
      - path: strategy-detections.json
        contract: ultrafuzz/json-array@1
      - path: finding-lifecycle-ledger.json
        contract: ultrafuzz/json-object@1
  - id: triage
    kind: agentic
    prompt: nofuzz/review/triage.md
    group: review
    depends_on:
      - dedupe-findings
    outputs:
      - path: triaged-findings.json
        contract: ultrafuzz/json-array@1
        primary: true
      - path: finding-lifecycle-ledger.json
        contract: ultrafuzz/json-object@1
  - id: severity-classification
    kind: agentic
    prompt: nofuzz/review/severity-classification.md
    group: review
    depends_on:
      - triage
    outputs:
      - path: severity-classified-findings.json
        contract: ultrafuzz/json-array@1
        primary: true
      - path: strategy-detections.json
        contract: ultrafuzz/json-array@1
      - path: finding-lifecycle-ledger.json
        contract: ultrafuzz/json-object@1
  - id: final-report
    kind: agentic
    prompt: nofuzz/review/final-report.md
    group: review
    depends_on:
      - severity-classification
      - dedupe-findings
    outputs:
      - path: report.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: report.json
        contract: ultrafuzz/report@1

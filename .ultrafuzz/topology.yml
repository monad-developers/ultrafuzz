version: 1
defaults:
  strategy_loops: 1
groups:
  setup:
    label: Setup
    color: "#2563eb"
  properties:
    label: Properties
    color: "#a16207"
  strategies:
    label: Strategies
    color: "#7c3aed"
    defaults:
      loops: 3
      timeout_seconds: 7200
      model_profiles:
        - default
  references:
    label: References
    color: "#4b5563"
  review:
    label: Review
    color: "#0f766e"

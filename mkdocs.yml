site_name: Ultrafuzz
site_description: Agentic Solidity fuzzing campaign documentation for security researchers and protocol developers.
site_url: https://monad-exp.github.io/ultrafuzz/
repo_url: https://github.com/monad-exp/ultrafuzz
repo_name: monad-exp/ultrafuzz
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Start Here: index.md
  - Tutorials:
      - tutorials/index.md
      - First Campaign: tutorials/first-campaign.md
  - How-to Guides:
      - how-to/index.md
      - Configure Backends and Models: how-to/configure-backends.md
      - Edit Prompts and Topology: how-to/edit-prompts-topology.md
      - Restart or Continue Campaigns: how-to/restart-continue.md
      - Use the Dashboard: how-to/use-dashboard.md
      - Review Findings: how-to/review-findings.md
      - Materialize Generated Tests: how-to/materialize-tests.md
      - Clean Runs: how-to/clean-runs.md
  - Reference:
      - reference/index.md
      - CLI Commands: reference/cli.md
      - Configuration and Environment: reference/configuration.md
      - Topology YAML: reference/topology-yaml.md
      - Prompt Variables: reference/prompt-variables.md
      - Run Artifacts and Reports: reference/artifacts-reports.md
      - Dashboard Controls and Security: reference/dashboard.md
      - GitHub Pages Deployment: reference/github-pages.md
      - Development Commands: reference/development.md
  - Explanation:
      - explanation/index.md
      - How Campaigns Work: explanation/campaigns.md
      - Topology, Prompts, and Artifacts: explanation/topology-prompts-artifacts.md
      - Agent Backends and Safety: explanation/backends-safety.md
      - Monad Bugfinder Context: explanation/bugfinder.md
  - Contributing: contributing.md

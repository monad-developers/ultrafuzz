schema_version = "1.0"
dynamic_strategies_enumerator = 3

[project]
repo = "."

[run]
output_dir = ".ultrafuzz/runs"
max_parallel_agents = 4
max_parallel_nodes = 8
keep_workspaces = false
workspace_mode = "git-worktree"
default_timeout_seconds = 1800
enable_dashboard = true

[backend]
default = "codex-cli"

[backend.codex_cli]
command = "codex"
auth_mode = "cli-session"
use_project_config = true
args = ["exec"]

[backend.codex_cli.env]

[backend.claude_code_cli]
command = "claude"
auth_mode = "cli-session"
use_project_config = true
args = []

[backend.claude_code_cli.env]

# Model profiles fan strategy attempts out across backend/model pairs. If no
# explicit profile is selected on a strategy, Ultrafuzz synthesizes a compatible
# `default` profile from [backend].default and the matching backend CLI config.
#
# Example:
#
# [models.gpt-5-5]
# backend = "codex-cli"
# model = "gpt-5.5"
#
# [models.claude-4-6]
# backend = "claude-code-cli"
# model = "claude-4.6"
#
# [strategies.encode-decode]
# models = ["gpt-5-5", "claude-4-6"]
# loops = 3

[permissions]
profile = "ultrafuzz-default"
backend_policy = "reuse-project-config"
sandbox = "workspace-write"
sandbox_required = true
approval_mode = "preapproved-only"
network = "disabled"
allow_dangerous_bypass = false
allow_target_repo_writes_during_attempts = false
materialize_outputs_as_unstaged = true
write_allow = [
  "workspace",
  "artifacts",
  "final-materialization",
]
read_deny = [
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "secrets/**",
  ".secrets/**",
  ".ssh/**",
  ".aws/**",
  ".gcloud/**",
  ".azure/**",
  "*.pem",
  "*.key",
]

[tools.commands]
allow = [
  "forge",
  "cast",
  "anvil",
  "solc",
  "recon",
  "recon-generate",
  "recon-fuzz",
  "covg-eval",
  "covg_eval",
  "medusa",
  "echidna",
  "halmos",
  "npx",
  "node",
  "npm",
  "pip show",
  "git",
  "jq",
  "rg",
  "grep",
  "wc",
  "head",
  "tail",
  "sort",
  "uniq",
  "cat",
  "ls",
  "sed",
  "awk",
  "find",
  "pwd",
  "sha256sum",
  "timeout",
  "mkdir",
  "cp",
  "mv",
  "rm",
]
deny = [
  "curl",
  "wget",
  "ssh",
  "scp",
  "nc",
  "netcat",
  "python -m http.server",
]

# Built-in strategies are resolved from prompt metadata. Use `ultrafuzz config
# inspect` to see full strategy definitions, including:
# differential-library-tests, round-trip, workflow-property-based-tests,
# encode-decode, expand-coverage, boundary-tests,
# amm-boundary-liquidity, payable-fallback-accounting, packed-action-parity,
# batch-atomicity-unsupported-actions, router-exact-accounting,
# rounding-direction-audit, market-exhaustion-boundaries, order-replacement-collateral,
# state-machine-boundaries, lifecycle-view-boundaries, dynamic-strategy-generator,
# stateful-invariant-setup, stateful-invariant-handlers,
# stateful-invariant-coverage.
# Property specification runs before strategy fan-out. It fans out internally to
# certora-thinking, crytic, runtime-verification, a16z, recon, aviggiano,
# 0kn0t, and josselin-feist lenses, then fans in to the consolidated
# `properties.md` catalog consumed by strategies. It is not configured as a
# strategy table.
# Add `[strategies.<id>]` tables here only when overriding a default.

[invariants]
# Property implementation consumes the consolidated property catalog and applies
# this inclusive priority threshold. Allowed values: "high", "medium", "low".
property_priority_threshold = "high"
# Invariant testing fuzzer campaign timeout. Supported duration suffixes include s, min, h.
invariant_testing_fuzzer_timeout = "1h"

[triage]
quorum = 3
panel_size = 5

[dashboard]
enabled = true
host = "127.0.0.1"
port = 3875
open_browser = false
live_updates = true
event_store = "sqlite"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="636" viewBox="0 0 960 636" role="img" aria-labelledby="title desc">
<title id="title">UltrafuzzBench performance versus cost</title>
<desc id="desc">Each model with complete cost is represented by the median cost and UltrafuzzBench Score (macro-F1) of its complete smoke runs in the current pricing regime. Horizontal and vertical bands show Type-7 interquartile ranges.</desc>
<rect width="960" height="636" fill="#ffffff"/>
<text x="90" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#111827">Performance × cost</text>
<text x="90" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">UltrafuzzBench smoke · complete runs in each model&apos;s current pricing regime</text>
<text x="90" y="88" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Dots are medians; horizontal cost bands and vertical macro-F1 bands show the IQR.</text>
<line x1="90" y1="120" x2="90" y2="440" stroke="#6b7280"/>
<line x1="90" y1="440" x2="920" y2="440" stroke="#6b7280"/>
<text transform="translate(22,280) rotate(-90)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">UltrafuzzBench Score (macro-F1)</text>
<text x="505" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">Cost per complete run (USD)</text>
<line x1="90" y1="120" x2="90" y2="440" stroke="#e5e7eb"/>
<text x="90" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">$0</text>
<line x1="90" y1="440" x2="920" y2="440" stroke="#e5e7eb"/>
<text x="80" y="445" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">0.0%</text>
<line x1="297.5" y1="120" x2="297.5" y2="440" stroke="#e5e7eb"/>
<text x="297.5" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">$5</text>
<line x1="90" y1="360" x2="920" y2="360" stroke="#e5e7eb"/>
<text x="80" y="365" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">10.0%</text>
<line x1="505" y1="120" x2="505" y2="440" stroke="#e5e7eb"/>
<text x="505" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">$10</text>
<line x1="90" y1="280" x2="920" y2="280" stroke="#e5e7eb"/>
<text x="80" y="285" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">20.0%</text>
<line x1="712.5" y1="120" x2="712.5" y2="440" stroke="#e5e7eb"/>
<text x="712.5" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">$15</text>
<line x1="90" y1="200" x2="920" y2="200" stroke="#e5e7eb"/>
<text x="80" y="205" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">30.0%</text>
<line x1="920" y1="120" x2="920" y2="440" stroke="#e5e7eb"/>
<text x="920" y="464" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">$20</text>
<line x1="90" y1="120" x2="920" y2="120" stroke="#e5e7eb"/>
<text x="80" y="125" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4b5563">40.0%</text>
<g data-model="deepseek-v4-pro" data-run-count="1" data-cost-q1="1.26551998" data-cost-median="1.26551998" data-cost-q3="1.26551998" data-f1-q1="0.1" data-f1-median="0.1" data-f1-q3="0.1"><title>deepseek-v4-pro: median 10.0% at $1.27; 1 run from 2026-08-01 to 2026-08-01</title>
<circle  fill="#2563eb" stroke="#ffffff" stroke-width="1" cx="142.52" cy="360" r="8"/>
</g>
<g data-model="gpt-5.6-luna" data-run-count="14" data-cost-q1="12.23037327" data-cost-median="13.47776234" data-cost-q3="14.6571929" data-f1-q1="0.18516667" data-f1-median="0.2249" data-f1-q3="0.29796667"><title>gpt-5.6-luna: median 22.5% at $13.48; 14 runs from 2026-07-31 to 2026-08-05 (current pricing since 2026-07-31)</title>

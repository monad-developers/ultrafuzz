<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="title desc">
<title id="title">UltrafuzzBench performance versus cost</title>
<desc id="desc">Each model with reported cost is represented by the median cost and UltrafuzzBench Score (macro-F1) of its smoke runs in the current pricing regime. Partial values use dashed rings, and every legend row reports available and expected target counts. Horizontal and vertical bands show Type-7 interquartile ranges. Missing cost values are listed for kimi-k3.</desc>

<text x="90" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#111827">Performance × cost</text>
<text x="90" y="66" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">UltrafuzzBench smoke · complete and marked partial costs in each model&apos;s current pricing regime</text>
<text x="90" y="88" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Dots are medians; dashed rings mark partial cost coverage; legends report target denominators.</text>

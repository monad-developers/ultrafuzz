packages:
  - "packages/security"
  - "packages/references"
  - "packages/config"
  - "packages/prompts"
  - "packages/topology"
  - "packages/artifacts"
  - "packages/runtime"
  - "packages/evals"
  - "packages/dashboard"
  - "packages/evmbench"
  - "packages/modal"
  - "packages/cli"
# The Effect entries mirror the Effect pins in REQUIRED_SMITHERS_OVERRIDES in
# packages/runtime/src/smithers-package.ts. Launch's generated controller
# workspace pins these so its npm install cannot mix two Effect builds; pinning
# them here too means the installed runner that resume and the other lifecycle
# commands run, and the repository's real Smithers integration tests, get the
# same Effect builds as launch, instead of whatever the open caret on
# @effect/platform-node-shared happens to resolve to. A CI test asserts the two
# Effect lists stay identical.
#
# @smthrs/cli 0.35.0 pins @toon-format/toon 2.3.0 exactly, which has a high
# prototype-pollution advisory for decoding untrusted TOON (GHSA-p95v-992w-h6c3,
# fixed in 2.3.1). Ultrafuzz never runs the pack commands that decode TOON, but
# the pinned runner is a production dependency, so take the patch release.
overrides:
  effect: "4.0.0-beta.105"
  "@effect/opentelemetry": "4.0.0-beta.105"
  "@effect/platform-bun": "4.0.0-beta.105"
  "@effect/platform-node-shared": "4.0.0-beta.105"
  "@effect/sql-sqlite-bun": "4.0.0-beta.105"
  "@smthrs/cli>@toon-format/toon": "2.3.1"
  # Mirror generated-controller security pins across the repository install.
  # The operator npm's bundled Undici is updated in patches/npm@11.19.0.patch.
  "@modelcontextprotocol/sdk": "1.32.0"
  "body-parser": "2.4.0"
  "dompurify": "3.4.17"
  # The Smithers server and MCP SDK both allow this patched Hono release.
  "hono": "4.13.14"
  "zod": "4.6.6"
allowBuilds:
  "@moonshot-ai/kimi-code": false
  "@parcel/watcher": false
  "@smthrs/jj-darwin-arm64": false
  "@smthrs/jj-linux-arm64": false
  "@smthrs/jj-linux-x64": false
  cbor-extract: true
  esbuild: true
  koffi: false
  msgpackr-extract: false
  node-pty: false
  protobufjs: true
# The Smithers entries are generated from SMITHERS_COMPATIBILITY_PATCHES by
# scripts/smithers-patches.mjs; CI fails when they drift from the registry.
patchedDependencies:
  "@smthrs/time-travel@0.35.0": patches/@smthrs__time-travel@0.35.0.patch
  "@smthrs/agents@0.35.0": patches/@smthrs__agents@0.35.0.patch
  "@smthrs/cli@0.35.0": patches/@smthrs__cli@0.35.0.patch
  "@smthrs/db@0.35.0": patches/@smthrs__db@0.35.0.patch
  "@smthrs/engine@0.35.0": patches/@smthrs__engine@0.35.0.patch
  "@smthrs/scheduler@0.35.0": patches/@smthrs__scheduler@0.35.0.patch
  npm@11.19.0: patches/npm@11.19.0.patch
  smthrs@0.35.0: patches/smthrs@0.35.0.patch

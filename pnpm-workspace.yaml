packages:
  - "packages/security"
  - "packages/references"
  - "packages/config"
  - "packages/prompts"
  - "packages/topology"
  - "packages/artifacts"
  - "packages/runtime"
  - "packages/evals"
  - "packages/dashboard"
  - "packages/evmbench"
  - "packages/modal"
  - "packages/cli"
# Mirrors REQUIRED_SMITHERS_OVERRIDES in packages/runtime/src/smithers-package.ts.
# The generated runner workspace pins these so a cloud run cannot install two
# Effect builds; pinning them here too means the repository's real Smithers
# integration test exercises the same Effect tree production installs, instead of
# whatever the open caret on @effect/platform-node-shared happens to resolve to.
# A runtime test asserts the two lists stay identical.
overrides:
  effect: "4.0.0-beta.105"
  "@effect/opentelemetry": "4.0.0-beta.105"
  "@effect/platform-bun": "4.0.0-beta.105"
  "@effect/platform-node-shared": "4.0.0-beta.105"
  "@effect/sql-sqlite-bun": "4.0.0-beta.105"
allowBuilds:
  "@moonshot-ai/kimi-code": false
  "@parcel/watcher": false
  "@smthrs/jj-linux-arm64": false
  "@smthrs/jj-linux-x64": false
  cbor-extract: true
  esbuild: true
  koffi: false
  msgpackr-extract: false
  node-pty: false
  protobufjs: true

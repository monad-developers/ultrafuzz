schema_version = "ultrafuzz.config.v2"
audit_profile = "default"
dynamic_strategies_enumerator = 3

[project]
repo = "."

[run]
output_dir = ".ultrafuzz/runs"
max_parallel_agents = 4
max_parallel_nodes = 8
keep_workspaces = false
forge_guard_enabled = true
forge_vmem_limit_kb = 12582912
forge_rayon_threads = 1
workspace_mode = "git-worktree"
default_timeout_seconds = 1800
workflow_deadline_seconds = 86400
controller_lease_seconds = 30

[execution]
mode = "local"
retention_days = 30

[execution.resources]
cpu = 4
memory_mib = 8192
timeout_seconds = 1800

[models]
synthesized_default = true

[models.default]
agent = "CodexAgent"
model = "gpt-5.5"
reasoning = "xhigh"

# Opt-in Claude profile. Select it per node/group in .ultrafuzz/topology.yml
# (model_profiles = ["claude"]), or for a one-off run with `--agent ClaudeAgent`.
# ClaudeAgent passes profile `reasoning` to the current Claude Code CLI as --effort.
[models.claude]
agent = "ClaudeAgent"
model = "claude-opus-4-8"

# Opt-in Kimi profile. Select it per node/group in .ultrafuzz/topology.yml
# (model_profiles = ["kimi"]), or for a one-off run with `--agent KimiAgent`.
# `kimi-k3` is a local Kimi Code alias for model k3 at max effort.
[models.kimi]
agent = "KimiAgent"
model = "kimi-k3"
reasoning = "max"

# Opt-in DeepSeek V4 profile. DeepSeek's official coding-agent integration
# runs Claude Code against its Anthropic-compatible API endpoint.
[models.deepseek]
agent = "DeepSeekAgent"
model = "deepseek-v4-pro"
reasoning = "max"

# Automatic agent retries are error-agnostic and resend the same effective task
# prompt in a fresh session. The count includes the first primary attempt. Set `agents`
# to an ordered list of model profile IDs to opt into model fallback.
[retry]
same_agent_attempts = 1
agents = []

[agents.CodexAgent]
auth = "api-key"
api_key_env = "OPENAI_API_KEY"

[agents.ClaudeAgent]
# "subscription" uses your logged-in Claude Code CLI (`claude -p`); no API key needed,
# and ANTHROPIC_API_KEY is cleared so the subscription wins. Switch to "api-key" to
# bill against the Anthropic API instead (reads ANTHROPIC_API_KEY unless api_key_env
# names another variable).
#
# Per permissions.trust_model below, this agent runs with Claude Code's permission
# checks bypassed, so tasks get unattended filesystem and shell access inside their
# worktree. That is set in .smithers/agents/claude.ts, not here.
auth = "subscription"

[agents.KimiAgent]
# "subscription" uses your logged-in Kimi Code CLI from KIMI_CODE_HOME or
# ~/.kimi-code. Switch to "api-key" to bill against a Kimi/Moonshot-compatible
# API key instead. Built-in credential names are fixed by provider policy;
# KIMI_API_KEY is canonical and MOONSHOT_API_KEY remains a compatibility alias.
auth = "subscription"

[agents.DeepSeekAgent]
# DeepSeek V4 is API-key only. The generated adapter reads DEEPSEEK_API_KEY and
# routes Claude Code to DeepSeek's official Anthropic-compatible endpoint.
auth = "api-key"
api_key_env = "DEEPSEEK_API_KEY"

[agents.OpenRouterAgent]
# OpenRouter is API-key only. The generated Codex adapter reads this variable
# through Codex's native provider env_key and routes to https://openrouter.ai/api/v1.
auth = "api-key"
api_key_env = "OPENROUTER_API_KEY"

[permissions]
trust_model = "skip-permissions"
prompt_review_required = true
materialize_outputs_as_unstaged = true
# Target-relative roots whose committed contents are production source. Workspace
# handoffs fail closed if an agent edits, deletes, or adds a file under these roots.
production_source_roots = ["src", "contracts"]


[invariants]
property_priority_threshold = "high"
invariant_testing_smoke_timeout = "10min"
invariant_testing_fuzzer_timeout = "1h"

[triage]
quorum = 3
panel_size = 4

[eval]
eval_config = ".ultrafuzz/evals/bug-finding.yml"
# ground_truth_root is machine-specific and MUST resolve outside the repo, e.g.:
# ground_truth_root = "/secure/eval-ground-truth"
provider = "none"

[eval.providers.braintrust]
api_key_env = "BRAINTRUST_API_KEY"
project = "ultrafuzz-evals"

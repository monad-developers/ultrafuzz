version: 1
defaults:
  strategy_loops: 1
groups:
  setup:
    label: Setup
    color: "#2563eb"
  properties:
    label: Properties
    color: "#7c3aed"
  strategies:
    label: Strategies
    color: "#b45309"
  review:
    label: Review
    color: "#0f766e"
nodes:
  - id: __start__
    kind: meta
    role: start
    depends_on: []
  - id: project-discovery
    prompt: setup/project-discovery.md
    group: setup
    depends_on:
      - __start__
    required_artifacts:
      - setup/project-discovery.md
    primary_artifact: setup/project-discovery.md
    timeout_seconds: 240
  - id: actors-flows
    prompt: setup/actors-flows.md
    group: setup
    depends_on:
      - project-discovery
    required_artifacts:
      - setup/actors-flows.md
    primary_artifact: setup/actors-flows.md
    timeout_seconds: 240
  - id: setup-foundry
    prompt: setup/prepare-foundry-harness.md
    group: setup
    depends_on:
      - actors-flows
    required_artifacts:
      - setup/setup-foundry.md
    primary_artifact: setup/setup-foundry.md
    timeout_seconds: 240
  - id: base-test-setup
    prompt: setup/discover-base-test.md
    group: setup
    depends_on:
      - setup-foundry
    required_artifacts:
      - setup/base-test-setup.md
    primary_artifact: setup/base-test-setup.md
    timeout_seconds: 240
  - id: property-specification-fanin
    prompt: properties/property-specification-fanin.md
    group: properties
    depends_on:
      - base-test-setup
    required_artifacts:
      - properties.md
    primary_artifact: properties.md
    timeout_seconds: 240
  - id: stateful-invariant-setup
    prompt: strategies/invariants/setup.md
    group: strategies
    depends_on:
      - property-specification-fanin
    required_artifacts:
      - setup-inventory.md
    primary_artifact: setup-inventory.md
    timeout_seconds: 300
  - id: stateful-invariant-handlers
    prompt: strategies/invariants/handlers.md
    group: strategies
    depends_on:
      - stateful-invariant-setup
    required_artifacts:
      - handler-coverage-inventory.md
    primary_artifact: handler-coverage-inventory.md
    timeout_seconds: 300
  - id: stateful-invariant-coverage
    prompt: strategies/invariants/coverage.md
    group: strategies
    depends_on:
      - stateful-invariant-handlers
    required_artifacts:
      - coverage-goal.json
      - coverage-report.md
      - generated-tests.json
      - harness-repairs.json
      - findings.json
    primary_artifact: coverage-report.md
    timeout_seconds: 360
  - id: dedupe-findings
    prompt: review/dedupe-findings.md
    group: review
    depends_on:
      - stateful-invariant-coverage
    required_artifacts:
      - deduped-findings.json
      - findings.json
      - strategy-detections.json
      - finding-lifecycle-ledger.json
    primary_artifact: deduped-findings.json
    timeout_seconds: 300
  - id: triage
    prompt: review/triage.md
    group: review
    depends_on:
      - dedupe-findings
    required_artifacts:
      - triaged-findings.json
      - finding-lifecycle-ledger.json
    primary_artifact: triaged-findings.json
    timeout_seconds: 300
  - id: severity-classification
    prompt: review/severity-classification.md
    group: review
    depends_on:
      - triage
    required_artifacts:
      - severity-classified-findings.json
      - strategy-detections.json
      - finding-lifecycle-ledger.json
    primary_artifact: severity-classified-findings.json
    timeout_seconds: 300
  - id: aggregate-test-files
    prompt: review/aggregate-test-files.md
    group: review
    depends_on:
      - severity-classification
    required_artifacts:
      - aggregation.json
    primary_artifact: aggregation.json
    timeout_seconds: 300
  - id: final-report
    prompt: review/final-report.md
    group: review
    depends_on:
      - aggregate-test-files
    required_artifacts:
      - report.md
      - report.json
    primary_artifact: report.md
    timeout_seconds: 420
  - id: __finish__
    kind: meta
    role: finish
    depends_on:
      - final-report

version: 2
defaults:
  strategy_loops: 1
groups:
  setup:
    label: Setup
    color: "#2563eb"
  strategies:
    label: Strategies
    color: "#0f766e"
  review:
    label: Review
    color: "#7c3aed"
nodes:
  - id: __start__
    kind: meta
    role: start
    depends_on: []
  - id: project-discovery
    kind: agentic
    prompt: setup/project-discovery.md
    model_profiles:
      - ci
    group: setup
    depends_on:
      - __start__
    outputs:
      - path: setup/project-discovery.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: findings.json
        contract: ultrafuzz/findings@1
    timeout_seconds: __NODE_TIMEOUT__
  - id: signal-analysis
    kind: agentic
    prompt: strategies/signal-analysis.md
    model_profiles:
      - ci
    group: strategies
    depends_on:
      - project-discovery
    outputs:
      - path: signal-analysis.md
        contract: ultrafuzz/nonempty-markdown@1
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
    timeout_seconds: __NODE_TIMEOUT__
  - id: final-report
    kind: agentic
    prompt: review/final-report.md
    model_profiles:
      - ci
    group: review
    depends_on:
      - signal-analysis
    outputs:
      - path: report.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: report.json
        contract: ultrafuzz/report@1
    timeout_seconds: __NODE_TIMEOUT__
  - id: __finish__
    kind: meta
    role: finish
    depends_on:
      - final-report

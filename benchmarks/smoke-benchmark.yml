version: 2
defaults:
  strategy_loops: 1
groups:
  setup:
    label: Smoke context
    color: "#2563eb"
    defaults:
      timeout_seconds: 1200
      max_attempts: 2
      model_profiles:
        - smoke-coordination
  strategies:
    label: Ground-truth-informed smoke strategies
    color: "#7c3aed"
    defaults:
      timeout_seconds: 1200
      loops: 1
      max_attempts: 2
      model_profiles:
        - benchmark
  goals:
    label: Threat goals
    color: "#be123c"
    defaults:
      timeout_seconds: 1200
      loops: 1
      max_attempts: 2
      model_profiles:
        - benchmark
  references:
    label: References
    color: "#4b5563"
  review:
    label: Bounded smoke review
    color: "#0f766e"
    defaults:
      timeout_seconds: 1200
      max_attempts: 2
      model_profiles:
        - smoke-coordination
nodes:
  - id: __start__
    kind: meta
    role: start
    depends_on: []
  - id: __finish__
    kind: meta
    role: finish
    depends_on:
      - final-report
  - id: reference-vulnerability-database
    kind: reference
    reference: vulnerability-database.web3
    group: references
    depends_on:
      - __start__
    outputs:
      - path: vulnerability-db/catalog.json
        contract: ultrafuzz/json-object@1
        primary: true
      - path: references/manifest.json
        contract: ultrafuzz/json-object@1
  - id: smoke-context
    kind: agentic
    prompt: smoke/smoke-context.md
    group: setup
    depends_on:
      - __start__
    outputs:
      - path: smoke-context.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
  - id: threat-model
    kind: agentic
    prompt: smoke/smoke-threat-model.md
    group: setup
    depends_on:
      - smoke-context
      - reference-vulnerability-database
    outputs:
      - path: THREAT_MODEL.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: threat-model.json
        contract: ultrafuzz/threat-model@1
  - id: goal-plan
    kind: agentic
    prompt: setup/goal-plan.md
    group: setup
    depends_on:
      - threat-model
      - reference-vulnerability-database
    outputs:
      - path: goal-plan.json
        contract: ultrafuzz/goal-plan@1
        primary: true
      - path: vulnerability-db-manifest.json
        contract: ultrafuzz/json-object@1
  - id: goal-roaming
    kind: agentic
    prompt: strategies/roaming-goal.md
    group: goals
    depends_on:
      - threat-model
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: threat-goals
    kind: agentic
    prompt: strategies/goal-hunter.mdx
    group: goals
    depends_on:
      - goal-plan
    dynamic:
      from:
        node: goal-plan
        path: $.threat_goals
      key: id
      node_id: "dynamic:threat:{{ item.id }}"
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: class-goals
    kind: agentic
    prompt: strategies/goal-hunter.mdx
    group: goals
    depends_on:
      - goal-plan
    dynamic:
      from:
        node: goal-plan
        path: $.class_goals
      key: id
      node_id: "dynamic:class:{{ item.id }}"
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: time-warp-sequences
    kind: agentic
    prompt: smoke/smoke-strategy.md
    group: strategies
    depends_on:
      - smoke-context
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: external-dependency-boundaries
    kind: agentic
    prompt: smoke/smoke-strategy.md
    group: strategies
    depends_on:
      - smoke-context
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: externalized-state-accounting
    kind: agentic
    prompt: smoke/smoke-strategy.md
    group: strategies
    depends_on:
      - smoke-context
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: lifecycle-view-boundaries
    kind: agentic
    prompt: smoke/smoke-strategy.md
    group: strategies
    depends_on:
      - smoke-context
    outputs:
      - path: findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: generated-tests.json
        contract: ultrafuzz/generated-tests@1
  - id: dedupe-findings
    kind: agentic
    prompt: smoke/smoke-dedupe-findings.md
    group: review
    depends_on:
      - time-warp-sequences
      - external-dependency-boundaries
      - externalized-state-accounting
      - lifecycle-view-boundaries
      - goal-roaming
      - threat-goals
      - class-goals
    outputs:
      - path: deduped-findings.json
        contract: ultrafuzz/findings@1
        primary: true
      - path: strategy-detections.json
        contract: ultrafuzz/json-array@1
      - path: finding-lifecycle-ledger.json
        contract: ultrafuzz/json-object@1
  - id: final-report
    kind: agentic
    prompt: smoke/smoke-final-report.md
    group: review
    depends_on:
      - dedupe-findings
    outputs:
      - path: report.md
        contract: ultrafuzz/nonempty-markdown@1
        primary: true
      - path: report.json
        contract: ultrafuzz/report@1
      - path: findings.normalized.json
        contract: ultrafuzz/findings@1

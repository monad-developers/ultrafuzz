bugs:
  - id: total-borrowed-v0
    severity: high
    title: Total borrowed assets must not exceed supplied assets under the auditor definition
    root_cause_keywords: ["total borrowed", "total supplied", "borrowed less than supplied", "Hub accounting"]
    affected_files: ["src/hub/Hub.sol", "src/hub/libraries/AssetLogic.sol"]
    affected_functions: ["invariant_totalBorrowedLessThanSupplied_v0", "getAssetTotalOwed", "totalAddedAssets"]
    impact_keywords: ["insolvency", "accounting deficit", "borrowed assets exceed supplied assets"]
    evidence_keywords: ["invariant_totalBorrowedLessThanSupplied_v0", "total-borrowed-v0"]

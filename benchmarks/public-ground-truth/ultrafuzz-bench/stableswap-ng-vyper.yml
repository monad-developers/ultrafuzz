bugs:
  - id: critical-rebasing-rewards-stuck
    severity: critical
    title: Rebasing rewards will get stuck on the contract
    root_cause: stored_balances omitted rebaseable-token rewards, making accrued value impossible to withdraw
  - id: critical-get-virtual-price-donation-skim
    severity: critical
    title: get_virtual_price can be manipulated
    root_cause: Direct token transfers inflated virtual price and could be skimmed through exchange_received
  - id: critical-metapool-old-base-readonly-reentrancy
    severity: critical
    title: Read-only reentrancy in a metapool with an old base pool
    root_cause: A metapool consumed a manipulated old base-pool virtual price
  - id: high-metapool-meta-coin-stored-balances-update
    severity: high
    title: Incorrect metapool storage update
    root_cause: A metapool path used the wrong dx_w_fee when updating stored_balances
  - id: high-metapool-base-pool-swap-stored-balances-update
    severity: high
    title: Incorrect base-pool swap accounting
    root_cause: A base-pool swap through the metapool updated metapool stored_balances when it should not
  - id: high-liquidity-gauge-crv-rate-update
    severity: high
    title: Incorrect CRV rate update
    root_cause: LiquidityGauge fetched the CRV rate before advancing the CRV epoch and stored a stale rate
  - id: high-empty-gauge-rewards-last-update
    severity: high
    title: Incorrect rewards distribution in an empty gauge
    root_cause: Depositing rewards at zero total supply advanced last_update and trapped rewards
